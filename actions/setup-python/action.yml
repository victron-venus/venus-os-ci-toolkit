name: 'Setup Python'
description: 'Setup Python 3.10+ with hash-locked common tools'
inputs:
  python-version:
    description: 'Python version to install (3.10 or newer)'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Verify supported Python version
      shell: bash
      run: |
        python -c 'import sys; sys.version_info >= (3, 10) or sys.exit("Setup Python requires Python 3.10 or newer: older compatible pytest releases are affected by CVE-2025-71176. Update the python-version input.")'

    - name: Install common tools
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r "$GITHUB_ACTION_PATH/requirements.txt"
