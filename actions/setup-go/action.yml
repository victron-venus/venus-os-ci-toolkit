name: 'Setup Go'
description: 'Setup Go with caching and common tools'
inputs:
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.26.8'
  golangci-lint-major:
    description: 'golangci-lint config generation (1 or 2)'
    required: false
    default: '1'
runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'

    - name: Install common tools
      shell: bash
      env:
        GOLANGCI_LINT_MAJOR: ${{ inputs.golangci-lint-major }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GOWORK: 'off'
      run: |
        case "$GOLANGCI_LINT_MAJOR" in
          1) lint_module=golangci-v1; lint_package=github.com/golangci/golangci-lint/cmd/golangci-lint ;;
          2) lint_module=golangci-v2; lint_package=github.com/golangci/golangci-lint/v2/cmd/golangci-lint ;;
          *) echo 'golangci-lint-major must be 1 or 2.' >&2; exit 1 ;;
        esac
        go -C "$GITHUB_ACTION_PATH/tools/govulncheck" install -mod=readonly golang.org/x/vuln/cmd/govulncheck
        go -C "$GITHUB_ACTION_PATH/tools/$lint_module" install -mod=readonly "$lint_package"
