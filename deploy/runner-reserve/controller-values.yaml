replicaCount: 1
serviceAccount:
  create: true
  name: victron-reserve-controller
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector:
  kubernetes.io/hostname: h5
  kubernetes.io/arch: amd64
flags:
  autoscalingListenerMaxConcurrentReconciles: 2
  autoscalingRunnerSetMaxConcurrentReconciles: 2
  ephemeralRunnerMaxConcurrentReconciles: 4
  ephemeralRunnerSetMaxConcurrentReconciles: 2
  logLevel: info
  logFormat: json

image:
  repository: ghcr.io/actions/gha-runner-scale-set-controller
  tag: 0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90
