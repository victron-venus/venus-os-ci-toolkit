replicaCount: 1
serviceAccount:
  create: true
  name: victron-reserve-controller
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector:
  kubernetes.io/hostname: mp
  kubernetes.io/arch: amd64
flags:
  logLevel: info
  logFormat: json

image:
  repository: ghcr.io/actions/gha-runner-scale-set-controller
  tag: 0.15.0@sha256:162dfb5bfbda9e7e49fbed67d428994c9ced55b41a37a18b75b46dab0aa98d37
