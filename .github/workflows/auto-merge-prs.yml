name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: >-
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: ./.github/workflows/auto-merge.yml
    with:
      native-auto-merge: true
      required-status-checks: CodeQL,SonarCloud Code Analysis
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
