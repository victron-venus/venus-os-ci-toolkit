name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

# Withdrawal evidence must survive later events, including pending-run replacement.
# Ordinary state evaluations still coalesce; metadata-only edits stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref != github.event.repository.default_branch)) && github.run_id || (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: ./.github/workflows/auto-merge.yml
    with:
      native-auto-merge: ${{ !((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref != github.event.repository.default_branch)) }}
      withdrawal-only: ${{ ((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref != github.event.repository.default_branch)) }}
      required-status-checks: CodeQL,SonarCloud Code Analysis
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
