name: Prepare current builder source locks for review
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed preparation branch commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: builder-lock-preparation
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  prepare:
    if: github.repository == 'victron-venus/venus-os-ci-toolkit' && github.ref == 'refs/heads/prep/oci-builder-source-locks' && inputs.reviewed_commit == github.sha
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: buildx
            go: '1.26.10'
          - component: buildkit
            go: '1.27.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PREPARE_COMPONENT: ${{ matrix.component }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Resolve exact dependencies and record production importers without compiling
        run: python3 scripts/prepare_builder_locks.py
      - name: Preserve small review inputs and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-prepared-locks-${{ matrix.component }}
          path: ${{ runner.temp }}/builder-lock-${{ matrix.component }}/review/
          if-no-files-found: error
          retention-days: 14
