# Keep native OS coverage separate from generic Ubuntu runner routing.
name: Python action compatibility
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  python-action-contracts:
    name: Python action (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the checked-out composite action
        uses: ./actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Verify installed tools and plugins
        shell: bash
        working-directory: tests/fixtures/python_action_smoke
        run: |
          python -m pip check
          python -m ruff check .
          python -m pytest -q --cov=calculator --cov-fail-under=100

  python-remote-action:
    name: Downloaded Python action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Deliberately no checkout: the consumer has no Python dependency files.
      # Update this source pin when changing the composite action under test.
      - name: Exercise the downloaded composite action
        uses: victron-venus/venus-os-ci-toolkit/actions/setup-python@5892b68cf18ac330b76773532ca28bb716492fe9 # main
        with:
          python-version: '3.12'
      - name: Verify tools in an empty consumer
        shell: bash
        run: |
          python -c 'from pathlib import Path; import pytest_asyncio, pytest_cov; assert not Path("pyproject.toml").exists(); assert not Path("requirements.txt").exists()'
          python -m pip check
          python -m ruff --version
          python -m pytest --version
