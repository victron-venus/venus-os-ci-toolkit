# Keep native OS coverage separate from generic Ubuntu runner routing.
name: Python action compatibility
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  secret-control-contracts:
    name: Secret recovery (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned age for synthetic recovery tests
        run: python scripts/install-age-for-tests.py
      - name: Install hash-locked secret publisher dependencies for offline contract tests
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r tools/secret_control/requirements-oci-lock.txt
          -r tools/secret_control/requirements-github-lock.txt
      - name: Set up Terraform for mocked bootstrap contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false
      - name: Verify both bootstrap roots with mocked providers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        env:
          TF_IN_AUTOMATION: '1'
          TF_INPUT: 'false'
          TF_CLI_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          terraform fmt -check -recursive deploy/secret-bootstrap
          for root in deploy/secret-bootstrap/oci deploy/secret-bootstrap/hcp; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly -no-color
            terraform -chdir="$root" validate -no-color
            terraform -chdir="$root" test -no-color
          done
          printf 'SECRET_CONTROL_TERRAFORM=%s\n' "$(command -v terraform)" >> "$GITHUB_ENV"
      - name: Verify private I/O, publication contracts and real encryption recovery
        env:
          SECRET_CONTROL_AGE: ${{ runner.temp }}/secret-control-age/age
          SECRET_CONTROL_AGE_KEYGEN: ${{ runner.temp }}/secret-control-age/age-keygen
        run: python -m unittest discover -s tests -p 'test_secret_*.py' -v

  python-action-contracts:
    name: Python action (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the checked-out composite action
        uses: ./actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Verify installed tools and plugins
        shell: bash
        working-directory: tests/fixtures/python_action_smoke
        run: |
          python -m pip check
          python -m ruff check .
          python -m pytest -q --cov=calculator --cov-fail-under=100

  python-remote-action:
    name: Downloaded Python action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # Deliberately no checkout: the consumer has no Python dependency files.
      # Update this source pin when changing the composite action under test.
      - name: Exercise the downloaded composite action
        uses: victron-venus/venus-os-ci-toolkit/actions/setup-python@cd07a77d4a069dd14fff57d07e47dafbda082ab6 # main
        with:
          python-version: '3.12'
      - name: Verify tools in an empty consumer
        shell: bash
        run: |
          python -c 'from pathlib import Path; import pytest_asyncio, pytest_cov; assert not Path("pyproject.toml").exists(); assert not Path("requirements.txt").exists()'
          python -m pip check
          python -m ruff --version
          python -m pytest --version
