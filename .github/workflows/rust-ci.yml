name: 'Reusable Rust CI'
# description: 'Reusable CI workflow for Rust projects'
on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      rust-toolchain:
        description: 'Rust toolchain (stable, beta, nightly)'
        type: string
        default: 'stable'
      components:
        description: 'Rust components to install (clippy, rustfmt, etc.)'
        type: string
        default: 'clippy,rustfmt'
      enable-clippy:
        description: 'Whether to run cargo clippy'
        type: boolean
        default: true
      enable-fmt:
        description: 'Whether to run cargo fmt check'
        type: boolean
        default: true
      enable-tests:
        description: 'Whether to run cargo test'
        type: boolean
        default: true
      test-args:
        description: 'Additional arguments for cargo test'
        type: string
        default: ''
      apt-packages:
        description: 'Space-separated apt packages to install before cargo runs (system libs, e.g. GTK/WebKit dev headers)'
        type: string
        default: ''
      # Frontend-related inputs (optional)
      enable-frontend:
        description: 'Whether to build/check frontend (Node.js)'
        type: boolean
        default: false
      node-version:
        description: 'Node.js version for frontend builds'
        type: string
        default: '24'
      frontend-working-directory:
        description: 'Working directory for frontend (if different from main)'
        type: string
        default: ''
jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install apt packages
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: ${{ inputs.components }}

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs.working-directory }} -> target

      - name: Check Rust Formatting
        if: inputs.enable-fmt
        run: cargo fmt -- --check

      - name: Run Clippy
        if: inputs.enable-clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        if: inputs.enable-tests
        run: cargo test --all-targets ${{ inputs.test-args }}

  # Optional frontend job
  frontend:
    name: Frontend CI
    needs: rust-ci
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        working-directory: ${{ inputs.frontend-working-directory || inputs.working-directory }}
        run: npm ci --ignore-scripts
      - name: Prettier check
        working-directory: ${{ inputs.frontend-working-directory || inputs.working-directory }}
        run: npm run format:check
      - name: Build frontend
        working-directory: ${{ inputs.frontend-working-directory || inputs.working-directory }}
        run: npm run build
