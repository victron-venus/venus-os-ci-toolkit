                    )
            return {
                "artifact_name": name + "-" + attempt,
                "report_file": report,
                "format": format_name,
                "flags": flag,
                "mode": mode,
                "commit": commit,
                "pull_request": pull_request,
                "tested_sha": tested_sha,
            }


        def integer(value, *, positive=False):
            """Reject negative, fractional and non-finite coverage counters."""
            require(
