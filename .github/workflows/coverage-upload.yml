# Generated by scripts/render_coverage_upload.py; edit scripts/coverage_reports.py or the renderer.
# Validator SHA-256: 7b3a1ef282b2352b021fad6e1e299d57cc0000d8e10e036079670e31e7eceec5
# Only uploader-step failures may be informational; artifact/report failures always fail.
name: Shared coverage upload
'on':
  workflow_call:
    inputs:
      artifact-name:
        description: Base artifact name; the producer must append a hyphen and the current run attempt
        type: string
        required: true
      report-file:
        description: Single relative report file inside the artifact
        type: string
        default: coverage.xml
      format:
        description: 'Report format: cobertura, go or lcov'
        type: string
        required: true
      flags:
        description: One stable alphanumeric coverage flag (hyphen/underscore allowed)
        type: string
        required: true
      required:
        description: Make trusted uploader-step failure blocking; fork publication remains informational
        type: boolean
        default: false
    outputs:
      upload-outcome:
        description: Official uploader step outcome; success does not independently prove provider processing
        value: ${{ jobs.oidc.outputs.upload-outcome || jobs.tokenless.outputs.upload-outcome }}
permissions:
  contents: read
jobs:
  oidc:
    name: Coverage / OIDC
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      COVERAGE_ARTIFACT: ${{ inputs.artifact-name }}
      COVERAGE_FILE: ${{ inputs.report-file }}
      COVERAGE_FORMAT: ${{ inputs.format }}
      COVERAGE_FLAGS: ${{ inputs.flags }}
      COVERAGE_MODE: oidc
    outputs:
      upload-outcome: ${{ steps.upload.outcome }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit
    - name: Validate public event and report contract
      id: contract
      shell: bash
      run: |
        umask 077
        cat > "$RUNNER_TEMP/coverage_reports.py" <<'TOOLKIT_COVERAGE_REPORTS_PY'
