            require(isinstance(value, str) and 0 < len(value) <= 240, "Invalid report path")
            parts = value.split("/")
            require(
                not PurePosixPath(value).is_absolute()
                and all(
                    p not in {"", ".", ".."} and re.fullmatch(r"[A-Za-z0-9_.-]+", p)
                    for p in parts
                ),
                "Report path must be a confined relative file",
            )
            return value


