name: Build reviewed gVisor VFS candidate

'on':
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gvisor-vfs-candidate-artifact-only
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Audit outbound connections
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build fixed public inputs and run allowed unit tests
        run: python3 scripts/build_gvisor_vfs_candidate.py build
      - name: Retain candidate or failure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvisor-vfs-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gvisor-vfs-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
