name: CodeQL

# Direct trigger so the repo's own code_scanning branch ruleset (CodeQL
# required) is satisfied on push/PR. The toolkit previously had no workflow
# that runs CodeQL against its own commits — every security workflow here is
# reusable-only (workflow_call), consumed by other repos' caller workflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # The toolkit contains no application source code — only GitHub
          # Actions workflows and docs. The 'actions' query pack analyzes
          # workflow files themselves (injection, unpinned actions, etc.);
          # any other language fails finalize with "no source code seen".
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:actions"
