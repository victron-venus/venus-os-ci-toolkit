# Retired publisher/dispatcher. Historical implementation: docs/legacy-workflows/release.yml.txt
name: Retired legacy release
'on':
  workflow_call:
    inputs:
      tag-pattern:
        description: Tag pattern to trigger release (regex)
        type: string
        default: ^v[0-9]+\.[0-9]+\.[0-9]+$
      release-name:
        description: Release name template
        type: string
        default: Release ${{ github.ref_name }}
      draft:
        description: Create as draft release
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false
      generate-notes:
        description: Auto-generate release notes
        type: boolean
        default: true
      body-file:
        description: Path to release body file (optional)
        type: string
        default: ''
      skip-checkout:
        description: Skip the checkout step
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  migration-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Use the gated release policy
      run: 'echo "This legacy entry point is retired. Install the reviewed release policy and build-only adapter;
        see docs/release-workflow.md and docs/FLEET_ROLLOUT.md." >&2

        exit 1

        '
