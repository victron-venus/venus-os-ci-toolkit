name: Auto Merge

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON array of labels for a trusted metadata runner with Python 3 and gh
        type: string
        default: '["ubuntu-latest"]'
      pr-author:
        description: Comma-separated subset of trusted PR authors
        type: string
        default: '4alvit,californiantiramisu,dependabot[bot],renovate[bot]'
      merge-method:
        description: Merge method (merge, squash, rebase)
        type: string
        default: squash
      native-auto-merge:
        description: Request auto-merge immediately; requires all validation in the protected CI gate
        type: boolean
        default: false
      reviewed-merge:
        description: Wait for successful named checks and an independent trusted current-head approval, then merge that head
        type: boolean
        default: false
      reviewed-single-pass:
        description: Evaluate once without holding a runner; caller must provide completion wakeups and a recovery schedule
        type: boolean
        default: false
      allow-dependabot-actions-review:
        description: Trust same-repository GitHub Actions approvals of genuine Dependabot PRs in reviewed mode
        type: boolean
        default: false
      allow-owned-bot-actions-review:
        description: Trust the existing GitHub Actions fallback for same-repository californiantiramisu PRs
        type: boolean
        default: false
      required-status-checks:
        description: Additional exact check names; native mode requires branch protection for each, legacy mode waits for all observed checks
        type: string
        default: ''
    secrets:
      BOT_PAT:
        description: Token authorized to request native auto-merge; explicitly forward it from the caller
        required: true

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: ${{ fromJSON((github.event.repository.private || ((contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event_name) && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) && inputs.runner-labels != '["ubuntu-latest"]' && inputs.runner-labels || ((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event_name) && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_AUTOMATION_LABELS || '[]') || '["ubuntu-latest"]')) }}
    timeout-minutes: ${{ (inputs.native-auto-merge || inputs.reviewed-single-pass) && 5 || 125 }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Verify checks and request native auto-merge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHORS: ${{ inputs.pr-author }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          NATIVE_AUTO_MERGE: ${{ inputs.native-auto-merge }}
          REQUIRED_CHECKS: ${{ inputs.required-status-checks }}
          REVIEWED_MERGE: ${{ inputs.reviewed-merge }}
          REVIEWED_SINGLE_PASS: ${{ inputs.reviewed-single-pass }}
          ALLOW_DEPENDABOT_ACTIONS_REVIEW: ${{ inputs.allow-dependabot-actions-review }}
          ALLOW_OWNED_BOT_ACTIONS_REVIEW: ${{ inputs.allow-owned-bot-actions-review }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from urllib.parse import quote, urlparse


          TRUSTED_AUTHORS = {'4alvit', 'californiantiramisu', 'dependabot[bot]', 'renovate[bot]'}


          class CheckFailure(RuntimeError):
              """Observed validation failure, not an API or authentication error."""


          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()


          def snapshot(repo, number, reviewed=False):
              pr = json.loads(gh('pr', 'view', number, '--repo', repo, '--json',
                                   'author,labels,isDraft,isCrossRepository,baseRefName,baseRefOid,headRefOid,state,statusCheckRollup,autoMergeRequest'))
              if reviewed:
                  pages = json.loads(gh('api', '--paginate', '--slurp',
                                        f'repos/{repo}/pulls/{number}/reviews?per_page=100'))
                  pr['reviewHistory'] = [review for page in pages for review in page]
              return pr


          def canonical_author(author):
              # gh's GraphQL response names known GitHub Apps differently from REST.
              # Only normalize identities GitHub explicitly identifies as bots.
              aliases = {'app/dependabot': 'dependabot[bot]', 'app/renovate': 'renovate[bot]'}
              login = author['login']
              return aliases.get(login, login) if author.get('is_bot') is True else login


          def eligible(pr, default_branch, authors):
              return (pr['state'] == 'OPEN' and not pr['isDraft']
                      and canonical_author(pr['author']) in authors
                      and pr['baseRefName'] == default_branch
                      and 'automerge' in {label['name'] for label in pr['labels']})


          def check_state(pr, required, run_id):
              latest = {}
              own_identities = set()
              for index, check in enumerate(pr['statusCheckRollup'] or []):
                  name = check.get('name', check.get('context', ''))
                  workflow = check.get('workflowName', '')
                  url = check.get('detailsUrl', check.get('targetUrl', ''))
                  numbers = re.search(r'/actions/runs/(\d+)(?:/job/(\d+))?', url)
                  # Concurrent runs can execute in a different order from their IDs.
                  # Every active attempt blocks merge, even before its start is known.
                  active = (check.get('status') in {'QUEUED', 'IN_PROGRESS', 'WAITING', 'PENDING', 'REQUESTED'}
                            or check.get('state') == 'PENDING')
                  attempt = (active, check.get('startedAt', check.get('createdAt', '')) or '',
                             int(numbers[2] or 0) if numbers else 0,
                             int(numbers[1]) if numbers else 0)
                  # Workflow identity prevents unrelated same-name jobs masking failures.
                  # Unknown external providers remain separate unless their URL also matches.
                  identity = (workflow, name, '' if workflow else url or str(index))
                  if (run_id and f'/actions/runs/{run_id}/' in url
                          and (name == 'Auto Merge' or name.endswith(' / Auto Merge'))):
                      own_identities.add(identity)
                  if identity not in latest or attempt > latest[identity][0]:
                      latest[identity] = (attempt, check)
              checks = []
              own_registered = bool(own_identities) or not run_id
              # Identify self in the raw rollup: the other event of a dual caller
              # may register a newer skipped job with the same orchestration identity.
              # Deduplicate first, then remove only that verified self identity.
              for identity, (_, check) in latest.items():
                  if identity in own_identities:
                      continue
                  state = check.get('conclusion') if check.get('status') == 'COMPLETED' else check.get('state')
                  checks.append((identity, state or 'PENDING'))
              # GitHub can briefly return the previous run before registering this job.
              # Wait for the current context rather than treating old attempts as current.
              if not own_registered:
                  return False, tuple(sorted(checks))
              failed = [f'{identity[0] or "external"} / {identity[1]} ({state})'
                        for identity, state in checks
                        if state in {'FAILURE', 'ERROR', 'CANCELLED', 'TIMED_OUT', 'ACTION_REQUIRED', 'STALE', 'STARTUP_FAILURE'}]
              if failed:
                  raise CheckFailure('PR check failed: ' + '; '.join(failed)
                                     + '. Fix or rerun the failed check before auto-merge.')
              names = {identity[1] for identity, _ in checks}
              ready = (bool(checks) and required <= names
                       and all(state in {'SUCCESS', 'NEUTRAL', 'SKIPPED'} for _, state in checks))
              return ready, tuple(sorted(checks))


          def review_state(pr, actions_authors=frozenset()):
              # Read every review page. COMMENTED does not retract a prior decision;
              # DISMISSED does. Never accept the author's own or an old-head approval.
              latest = {}
              for review in sorted(pr['reviewHistory'], key=lambda item: item['id']):
                  login = (review.get('user') or {}).get('login') or f"unknown-reviewer-{review['id']}"
                  state = review['state']
                  if login and state in {'APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'}:
                      latest[login] = (state, review.get('commit_id'), review['id'], (review.get('user') or {}).get('type'))
              blocked = any(item[0] == 'CHANGES_REQUESTED' for item in latest.values())
              author = canonical_author(pr['author'])
              actions_allowed = (pr.get('isCrossRepository') is False
                                 and author in actions_authors
                                 and (author == 'californiantiramisu'
                                      or (author == 'dependabot[bot]' and pr['author'].get('is_bot') is True)))
              approved = any((login in {'4alvit', 'californiantiramisu'}
                              or (actions_allowed and login == 'github-actions[bot]' and kind == 'Bot'))
                             and login != canonical_author(pr['author'])
                             and state == 'APPROVED' and commit == pr['headRefOid']
                             for login, (state, commit, _, kind) in latest.items())
              return approved and not blocked, tuple(sorted(latest.items()))


          def checked_snapshot(pr, required, run_id, reviewed, actions_authors=frozenset()):
              ready, checks = check_state(pr, required, run_id)
              if not reviewed:
                  return ready, checks
              approved, reviews = review_state(pr, actions_authors)
              # Required checks must succeed, not merely finish or skip. Existing
              # check_state still rejects failures and pending optional checks.
              successful = {identity[1] for identity, state in checks if state == 'SUCCESS'}
              named_checks_pass = required <= successful and all(
                  state == 'SUCCESS' for identity, state in checks if identity[1] in required)
              ready = (ready and named_checks_pass and approved
                       and pr.get('isCrossRepository') is False)
              return ready, (checks, reviews)


          def request_protected_merge(repo, number, default_branch, authors, method, required):
              pr = snapshot(repo, number)
              if not eligible(pr, default_branch, authors):
                  if pr['state'] == 'OPEN' and pr.get('autoMergeRequest'):
                      gh('pr', 'merge', number, '--repo', repo, '--disable-auto')
                  print('PR is not eligible for auto-merge.')
                  return
              # GitHub evaluates effective active rules, including organization rules.
              # Fail closed on missing rules, unreadable rules, or an unprotected gate.
              rules = json.loads(gh('api', f'repos/{repo}/rules/branches/{quote(default_branch, safe="")}'))
              required = required | {'CI gate'}
              protected = set()
              strict = False
              for rule in rules:
                  if rule.get('type') == 'required_status_checks':
                      parameters = rule.get('parameters', {})
                      strict |= parameters.get('strict_required_status_checks_policy') is True
                      protected.update(check['context'] for check in parameters.get('required_status_checks', []))
              if not strict or not required <= protected:
                  raise RuntimeError('Native mode requires a strict protected branch and every required check, including CI gate.')
              fresh = snapshot(repo, number)
              if not eligible(fresh, default_branch, authors):
                  if fresh['state'] == 'OPEN' and fresh.get('autoMergeRequest'):
                      gh('pr', 'merge', number, '--repo', repo, '--disable-auto')
                  print('Eligibility changed; no merge requested.')
                  return
              if fresh['headRefOid'] != pr['headRefOid']:
                  print('PR head changed; the synchronize event will retry.')
                  return
              gh('pr', 'merge', number, '--repo', repo, '--auto', f'--{method}',
                 '--match-head-commit', fresh['headRefOid'])
              print('Requested native auto-merge; GitHub waits for the protected CI gate and reviews.')


          def reviewed_single_pass(repo, default_branch, authors, method, required, actions_authors):
              # Event payloads only wake this evaluator. Every candidate comes from
              # GitHub's authoritative, paginated open-PR list, never an artifact.
              allowed_events = {'pull_request', 'pull_request_target', 'pull_request_review',
                                'workflow_run', 'status', 'check_run', 'check_suite',
                                'schedule', 'workflow_dispatch'}
              if os.environ.get('GITHUB_EVENT_NAME') not in allowed_events:
                  raise RuntimeError('Unsupported single-pass wakeup event')
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
                  event = json.load(stream)
              if (event.get('repository') or {}).get('full_name') != repo:
                  raise RuntimeError('Wakeup repository does not match the current repository')
              run_id = os.environ.get('GITHUB_RUN_ID', '')
              if re.fullmatch(r'[1-9][0-9]*', run_id) is None:
                  raise RuntimeError('A verified current workflow run is required')
              current_run = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
              workflow_id = current_run.get('workflow_id')
              if ((current_run.get('repository') or {}).get('full_name') != repo
                      or current_run.get('id') != int(run_id)
                      or not isinstance(workflow_id, int) or isinstance(workflow_id, bool)
                      or workflow_id < 1):
                  raise RuntimeError('Could not verify the current orchestration workflow')
              run_cache = {run_id: current_run}
              check_cache = {}
              job_cache = {}
              server = urlparse(os.environ.get('GITHUB_SERVER_URL', 'https://github.com'))

              def own_check(check, head):
                  name = check.get('name', '')
                  url = urlparse(check.get('detailsUrl', ''))
                  match = re.fullmatch('/' + re.escape(repo) + r'/actions/runs/([1-9][0-9]*)/job/([1-9][0-9]*)', url.path)
                  if (check.get('__typename') != 'CheckRun'
                          or not (name == 'Auto Merge' or name.endswith(' / Auto Merge'))
                          or not match or url.query or url.fragment
                          or (url.scheme, url.netloc) != (server.scheme, server.netloc)):
                      return False
                  candidate_id, job_id = match.groups()
                  if candidate_id not in run_cache:
                      run_cache[candidate_id] = json.loads(gh('api', f'repos/{repo}/actions/runs/{candidate_id}'))
                  candidate = run_cache[candidate_id]
                  if ((candidate.get('repository') or {}).get('full_name') != repo
                          or candidate.get('id') != int(candidate_id)
                          or candidate.get('workflow_id') != workflow_id):
                      return False
                  # A check URL alone is not provenance: another app can copy it.
                  # Resolve the actual Actions job and require exactly one matching
                  # GitHub Actions check on this head, with that job's check ID.
                  if job_id not in job_cache:
                      job_cache[job_id] = json.loads(gh('api', f'repos/{repo}/actions/jobs/{job_id}'))
                  job = job_cache[job_id]
                  if (job.get('id') != int(job_id) or job.get('run_id') != int(candidate_id)
                          or job.get('name') != name):
                      return False
                  if head not in check_cache:
                      pages = json.loads(gh('api', '--paginate', '--slurp',
                                           f'repos/{repo}/commits/{head}/check-runs?filter=all&per_page=100'))
                      check_cache[head] = [item for page in pages for item in page['check_runs']]
                  matching = [item for item in check_cache[head]
                              if item.get('name') == name and item.get('details_url') == check.get('detailsUrl')]
                  return (len(matching) == 1
                          and bool(job.get('check_run_url'))
                          and matching[0].get('url') == job.get('check_run_url')
                          and matching[0].get('head_sha') == head
                          and (matching[0].get('app') or {}).get('slug') == 'github-actions')

              def observed(number):
                  value = snapshot(repo, str(number), reviewed=True)
                  for key in ('baseRefOid', 'headRefOid'):
                      if re.fullmatch(r'[0-9a-f]{40}', value.get(key, '')) is None:
                          raise RuntimeError('Missing current base or head identity')
                  base, head = value['baseRefOid'], value['headRefOid']
                  current_base_in_head = gh('api', f'repos/{repo}/compare/{base}...{head}',
                                             '--jq', '.merge_base_commit.sha') == base
                  if not current_base_in_head:
                      print(f'PR #{number} must include the current default branch before merge.', flush=True)
                  check_cache.clear()
                  value['statusCheckRollup'] = [check for check in value['statusCheckRollup'] or []
                                               if not own_check(check, head)]
                  ready, state = checked_snapshot(value, required, '', True, actions_authors)
                  return value, ready and current_base_in_head, (base, head, state)

              pages = json.loads(gh('api', '--paginate', '--slurp',
                                   f'repos/{repo}/pulls?state=open&per_page=100'))
              for row in (row for page in pages for row in page):
                  # This inexpensive REST prefilter cannot authorize a merge.
                  # Each actual decision uses three fresh complete snapshots.
                  if (row.get('draft') or (row.get('base') or {}).get('ref') != default_branch
                          or (row.get('user') or {}).get('login') not in authors
                          or 'automerge' not in {label.get('name') for label in row.get('labels', [])}
                          or ((row.get('head') or {}).get('repo') or {}).get('full_name') != repo):
                      continue
                  number = row.get('number')
                  if not isinstance(number, int) or isinstance(number, bool) or number < 1:
                      raise RuntimeError('Malformed candidate pull request identity')
                  previous = None
                  stable = True
                  for _ in range(3):
                      try:
                          value, ready, fingerprint = observed(number)
                      except CheckFailure as error:
                          print(f'PR #{number} is waiting: {error}', flush=True)
                          stable = False
                          break
                      if (not eligible(value, default_branch, authors) or not ready
                              or (previous is not None and previous != fingerprint)):
                          print(f'PR #{number} is not ready or changed; a later wakeup will retry.', flush=True)
                          stable = False
                          break
                      previous = fingerprint
                  if stable:
                      gh('pr', 'merge', str(number), '--repo', repo, f'--{method}',
                         '--match-head-commit', value['headRefOid'])
                      print(f'Merged reviewed PR #{number} at its verified head.', flush=True)


          def main():
              if not os.environ.get('GH_TOKEN', '').strip():
                  raise RuntimeError('BOT_PAT is missing. Configure it and explicitly forward it from the caller.')
              repo, number = os.environ['GITHUB_REPOSITORY'], os.environ['PR_NUMBER']
              single_pass = os.environ.get('REVIEWED_SINGLE_PASS') == 'true'
              if not single_pass and not number.isdecimal():
                  raise RuntimeError('A pull-request metadata event with a numeric PR number is required.')
              authors = {item.strip() for item in os.environ['PR_AUTHORS'].split(',') if item.strip()}
              if not authors or not authors <= TRUSTED_AUTHORS:
                  raise RuntimeError('pr-author must be a nonempty subset of the trusted PR authors.')
              method = os.environ['MERGE_METHOD']
              if method not in {'merge', 'squash', 'rebase'}:
                  raise RuntimeError('merge-method must be merge, squash, or rebase.')
              required = {item.strip() for item in os.environ['REQUIRED_CHECKS'].split(',') if item.strip()}
              default_branch = gh('api', f'repos/{repo}', '--jq', '.default_branch')
              reviewed = os.environ.get('REVIEWED_MERGE') == 'true'
              native = os.environ.get('NATIVE_AUTO_MERGE') == 'true'
              actions_authors = set()
              if os.environ.get('ALLOW_DEPENDABOT_ACTIONS_REVIEW') == 'true':
                  actions_authors.add('dependabot[bot]')
              if os.environ.get('ALLOW_OWNED_BOT_ACTIONS_REVIEW') == 'true':
                  actions_authors.add('californiantiramisu')
              if (single_pass or actions_authors) and not reviewed:
                  raise RuntimeError('Single-pass and Actions approval options require reviewed merge')
              if reviewed and (native or not required):
                  raise RuntimeError('Reviewed merge requires explicit checks and cannot use native mode.')
              if single_pass:
                  reviewed_single_pass(repo, default_branch, authors, method, required, actions_authors)
                  return
              if native:
                  request_protected_merge(repo, number, default_branch, authors, method, required)
                  return
              deadline = time.monotonic() + 120 * 60
              previous_green = None
              while time.monotonic() < deadline:
                  pr = snapshot(repo, number, reviewed=True) if reviewed else snapshot(repo, number)
                  if reviewed and pr.get('isCrossRepository') is not False:
                      print('Reviewed merge excludes forks and unknown repository identity.')
                      return
                  if not eligible(pr, default_branch, authors):
                      print('PR is not eligible: author, label, draft, target branch, or open state does not match.')
                      return
                  ready, checks = checked_snapshot(pr, required, os.environ.get('GITHUB_RUN_ID', ''), reviewed, actions_authors)
                  fingerprint = (pr['headRefOid'], checks)
                  if ready and fingerprint == previous_green:
                      fresh = snapshot(repo, number, reviewed=True) if reviewed else snapshot(repo, number)
                      fresh_ready, fresh_checks = checked_snapshot(fresh, required, os.environ.get('GITHUB_RUN_ID', ''), reviewed, actions_authors)
                      if (eligible(fresh, default_branch, authors) and fresh_ready
                              and (fresh['headRefOid'], fresh_checks) == fingerprint):
                          options = [] if reviewed else ['--auto']
                          gh('pr', 'merge', number, '--repo', repo, *options, f'--{method}',
                             '--match-head-commit', fresh['headRefOid'])
                          print('Merged reviewed PR head.' if reviewed else
                                'Requested native auto-merge for the verified PR head; repository protections still apply.')
                          return
                      previous_green = None
                  else:
                      previous_green = fingerprint if ready else None
                  print('Waiting for stable successful checks on the current PR head.', flush=True)
                  time.sleep(30)
              raise RuntimeError('Checks did not become green within 120 minutes. Inspect pending or missing checks and rerun.')


          if __name__ == '__main__':
              main()
          PY
