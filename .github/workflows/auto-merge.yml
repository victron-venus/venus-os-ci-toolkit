name: Auto Merge

on:
  workflow_call:
    inputs:
      pr-author:
        description: Comma-separated subset of trusted PR authors
        type: string
        default: '4alvit,californiantiramisu,dependabot[bot],renovate[bot]'
      merge-method:
        description: Merge method (merge, squash, rebase)
        type: string
        default: squash
      native-auto-merge:
        description: Request auto-merge immediately; requires all validation in the protected CI gate
        type: boolean
        default: false
      required-status-checks:
        description: Additional exact check names; native mode requires branch protection for each, legacy mode waits for all observed checks
        type: string
        default: ''
    secrets:
      BOT_PAT:
        description: Token authorized to request native auto-merge; explicitly forward it from the caller
        required: true

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.native-auto-merge && 5 || 125 }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify checks and request native auto-merge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHORS: ${{ inputs.pr-author }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          NATIVE_AUTO_MERGE: ${{ inputs.native-auto-merge }}
          REQUIRED_CHECKS: ${{ inputs.required-status-checks }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from urllib.parse import quote


          TRUSTED_AUTHORS = {'4alvit', 'californiantiramisu', 'dependabot[bot]', 'renovate[bot]'}


          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()


          def snapshot(repo, number):
              return json.loads(gh('pr', 'view', number, '--repo', repo, '--json',
                                   'author,labels,isDraft,baseRefName,headRefOid,state,statusCheckRollup,autoMergeRequest'))


          def canonical_author(author):
              # gh's GraphQL response names known GitHub Apps differently from REST.
              # Only normalize identities GitHub explicitly identifies as bots.
              aliases = {'app/dependabot': 'dependabot[bot]', 'app/renovate': 'renovate[bot]'}
              login = author['login']
              return aliases.get(login, login) if author.get('is_bot') is True else login


          def eligible(pr, default_branch, authors):
              return (pr['state'] == 'OPEN' and not pr['isDraft']
                      and canonical_author(pr['author']) in authors
                      and pr['baseRefName'] == default_branch
                      and 'automerge' in {label['name'] for label in pr['labels']})


          def check_state(pr, required, run_id):
              latest = {}
              own_identities = set()
              for index, check in enumerate(pr['statusCheckRollup'] or []):
                  name = check.get('name', check.get('context', ''))
                  workflow = check.get('workflowName', '')
                  url = check.get('detailsUrl', check.get('targetUrl', ''))
                  numbers = re.search(r'/actions/runs/(\d+)(?:/job/(\d+))?', url)
                  # Concurrent runs can execute in a different order from their IDs.
                  # Every active attempt blocks merge, even before its start is known.
                  active = (check.get('status') in {'QUEUED', 'IN_PROGRESS', 'WAITING', 'PENDING', 'REQUESTED'}
                            or check.get('state') == 'PENDING')
                  attempt = (active, check.get('startedAt', check.get('createdAt', '')) or '',
                             int(numbers[2] or 0) if numbers else 0,
                             int(numbers[1]) if numbers else 0)
                  # Workflow identity prevents unrelated same-name jobs masking failures.
                  # Unknown external providers remain separate unless their URL also matches.
                  identity = (workflow, name, '' if workflow else url or str(index))
                  if (run_id and f'/actions/runs/{run_id}/' in url
                          and (name == 'Auto Merge' or name.endswith(' / Auto Merge'))):
                      own_identities.add(identity)
                  if identity not in latest or attempt > latest[identity][0]:
                      latest[identity] = (attempt, check)
              checks = []
              own_registered = bool(own_identities) or not run_id
              # Identify self in the raw rollup: the other event of a dual caller
              # may register a newer skipped job with the same orchestration identity.
              # Deduplicate first, then remove only that verified self identity.
              for identity, (_, check) in latest.items():
                  if identity in own_identities:
                      continue
                  state = check.get('conclusion') if check.get('status') == 'COMPLETED' else check.get('state')
                  checks.append((identity, state or 'PENDING'))
              # GitHub can briefly return the previous run before registering this job.
              # Wait for the current context rather than treating old attempts as current.
              if not own_registered:
                  return False, tuple(sorted(checks))
              failed = [f'{identity[0] or "external"} / {identity[1]} ({state})'
                        for identity, state in checks
                        if state in {'FAILURE', 'ERROR', 'CANCELLED', 'TIMED_OUT', 'ACTION_REQUIRED', 'STALE', 'STARTUP_FAILURE'}]
              if failed:
                  raise RuntimeError('PR check failed: ' + '; '.join(failed)
                                     + '. Fix or rerun the failed check before auto-merge.')
              names = {identity[1] for identity, _ in checks}
              ready = (bool(checks) and required <= names
                       and all(state in {'SUCCESS', 'NEUTRAL', 'SKIPPED'} for _, state in checks))
              return ready, tuple(sorted(checks))


          def request_protected_merge(repo, number, default_branch, authors, method, required):
              pr = snapshot(repo, number)
              if not eligible(pr, default_branch, authors):
                  if pr['state'] == 'OPEN' and pr.get('autoMergeRequest'):
                      gh('pr', 'merge', number, '--repo', repo, '--disable-auto')
                  print('PR is not eligible for auto-merge.')
                  return
              # GitHub evaluates effective active rules, including organization rules.
              # Fail closed on missing rules, unreadable rules, or an unprotected gate.
              rules = json.loads(gh('api', f'repos/{repo}/rules/branches/{quote(default_branch, safe="")}'))
              required = required | {'CI gate'}
              protected = set()
              strict = False
              for rule in rules:
                  if rule.get('type') == 'required_status_checks':
                      parameters = rule.get('parameters', {})
                      strict |= parameters.get('strict_required_status_checks_policy') is True
                      protected.update(check['context'] for check in parameters.get('required_status_checks', []))
              if not strict or not required <= protected:
                  raise RuntimeError('Native mode requires a strict protected branch and every required check, including CI gate.')
              fresh = snapshot(repo, number)
              if not eligible(fresh, default_branch, authors):
                  if fresh['state'] == 'OPEN' and fresh.get('autoMergeRequest'):
                      gh('pr', 'merge', number, '--repo', repo, '--disable-auto')
                  print('Eligibility changed; no merge requested.')
                  return
              if fresh['headRefOid'] != pr['headRefOid']:
                  print('PR head changed; the synchronize event will retry.')
                  return
              gh('pr', 'merge', number, '--repo', repo, '--auto', f'--{method}',
                 '--match-head-commit', fresh['headRefOid'])
              print('Requested native auto-merge; GitHub waits for the protected CI gate and reviews.')


          def main():
              if not os.environ.get('GH_TOKEN', '').strip():
                  raise RuntimeError('BOT_PAT is missing. Configure it and explicitly forward it from the caller.')
              repo, number = os.environ['GITHUB_REPOSITORY'], os.environ['PR_NUMBER']
              if not number.isdecimal():
                  raise RuntimeError('A pull-request metadata event with a numeric PR number is required.')
              authors = {item.strip() for item in os.environ['PR_AUTHORS'].split(',') if item.strip()}
              if not authors or not authors <= TRUSTED_AUTHORS:
                  raise RuntimeError('pr-author must be a nonempty subset of the trusted PR authors.')
              method = os.environ['MERGE_METHOD']
              if method not in {'merge', 'squash', 'rebase'}:
                  raise RuntimeError('merge-method must be merge, squash, or rebase.')
              required = {item.strip() for item in os.environ['REQUIRED_CHECKS'].split(',') if item.strip()}
              default_branch = gh('api', f'repos/{repo}', '--jq', '.default_branch')
              if os.environ.get('NATIVE_AUTO_MERGE') == 'true':
                  request_protected_merge(repo, number, default_branch, authors, method, required)
                  return
              deadline = time.monotonic() + 120 * 60
              previous_green = None
              while time.monotonic() < deadline:
                  pr = snapshot(repo, number)
                  if not eligible(pr, default_branch, authors):
                      print('PR is not eligible: author, label, draft, target branch, or open state does not match.')
                      return
                  ready, checks = check_state(pr, required, os.environ.get('GITHUB_RUN_ID', ''))
                  fingerprint = (pr['headRefOid'], checks)
                  if ready and fingerprint == previous_green:
                      fresh = snapshot(repo, number)
                      fresh_ready, fresh_checks = check_state(fresh, required, os.environ.get('GITHUB_RUN_ID', ''))
                      if (eligible(fresh, default_branch, authors) and fresh_ready
                              and (fresh['headRefOid'], fresh_checks) == fingerprint):
                          gh('pr', 'merge', number, '--repo', repo, '--auto', f'--{method}',
                             '--match-head-commit', fresh['headRefOid'])
                          print('Requested native auto-merge for the verified PR head; repository protections still apply.')
                          return
                      previous_green = None
                  else:
                      previous_green = fingerprint if ready else None
                  print('Waiting for stable successful checks on the current PR head.', flush=True)
                  time.sleep(30)
              raise RuntimeError('Checks did not become green within 120 minutes. Inspect pending or missing checks and rerun.')


          if __name__ == '__main__':
              main()
          PY
