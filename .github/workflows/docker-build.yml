# Retired publisher/dispatcher. Historical implementation: docs/legacy-workflows/docker-build.yml.txt
name: Retired legacy docker-build
'on':
  workflow_call:
    inputs:
      image-name:
        description: Docker image name (without registry prefix)
        type: string
        required: true
      registry:
        description: 'Registry hostname (e.g., ghcr.io, docker.io). Default: ghcr.io'
        type: string
        default: ghcr.io
      registry-owner:
        description: 'Registry owner or organization. Default: github.repository_owner'
        type: string
        default: ${{ github.repository_owner }}
      image:
        description: Full image reference (registry/owner/image). If provided, overrides registry, registry-owner,
          and image-name.
        type: string
        default: ''
      dockerfile:
        description: Path to Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Build context path
        type: string
        default: .
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64
      tags:
        description: Additional tags (comma-separated)
        type: string
        default: ''
      push:
        description: Whether to push the image
        type: boolean
        default: true
      sbom:
        description: Generate SBOM (Software Bill of Materials)
        type: boolean
        default: false
      provenance:
        description: Generate provenance attestation
        type: boolean
        default: false
      cache-from:
        description: Cache from registry
        type: string
        default: type=gha
      cache-to:
        description: Cache to registry
        type: string
        default: type=gha,mode=max
    secrets:
      REGISTRY_USERNAME:
        description: Username for registry login (if not using GITHUB_TOKEN)
        required: false
      REGISTRY_PASSWORD:
        description: Password or token for registry login (if not using GITHUB_TOKEN)
        required: false
permissions:
  contents: read
jobs:
  migration-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Use the gated release policy
      run: 'echo "This legacy entry point is retired. Install the reviewed release policy and build-only adapter;
        see docs/release-workflow.md and docs/FLEET_ROLLOUT.md." >&2

        exit 1

        '
