name: Required security checks

on:
  workflow_call: {}

permissions:
  actions: read
  contents: read

jobs:
  trivy:
    name: Full-source security scan
    uses: ./.github/workflows/security-scan.yml
    with:
      run-codeql: false
      run-trivy: true
      run-dependency-review: false
      strict-trivy: true
      trivy-severity: HIGH,CRITICAL
