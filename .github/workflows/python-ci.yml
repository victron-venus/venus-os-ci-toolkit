name: 'Reusable Python CI'
# description: 'Reusable CI workflow for Python projects'
on:
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      python-version:
        description: 'Python version'
        type: string
        default: '3.12'
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      install-dependencies:
        description: 'Whether to install dependencies from pyproject.toml/requirements.txt'
        type: boolean
        default: true
      use-uv-lock:
        description: 'When install-dependencies is enabled, use uv.lock for all extras and check tools; reject missing or stale locks'
        type: boolean
        default: false
      run-lint:
        description: 'Whether to run linting (ruff)'
        type: boolean
        default: true
      run-type-check:
        description: 'Whether to run type checking (mypy)'
        type: boolean
        default: true
      run-tests:
        description: 'Whether to run tests (pytest)'
        type: boolean
        default: true
      test-args:
        description: 'Additional pytest arguments'
        type: string
        default: ''
      coverage-threshold:
        description: 'Minimum coverage percentage'
        type: number
        default: 80
      coverage-artifact-name:
        description: 'Export the existing coverage report under this artifact base name; empty keeps legacy inline upload'
        type: string
        default: ''
jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  ci:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only' }}
    name: CI
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: victron-venus/venus-os-ci-toolkit/actions/setup-python@062d60e8892d4a97e11f5985d0914d5b19fcd24e # main
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # Install dbus, glib, cairo and gobject-introspection development packages needed for dbus-python and PyGObject compilation
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev libcairo2-dev libgirepository-2.0-dev libgirepository1.0-dev
          # Update library cache and pkgconfig path
          sudo ldconfig
          # Ensure pkgconfig path includes standard locations
          export PKG_CONFIG_PATH="${PKG_CONFIG_PATH}:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          # Verify all required dependencies are detectable by pkg-config.
          # Ubuntu 24.04 (glib 2.80) dropped girepository-1.0/gobject-introspection-1.0 .pc files;
          # only girepository-2.0 exists there, older runners ship the 1.0 names.
          echo "Checking for dbus-1, glib-2.0, cairo and gobject introspection via pkg-config..."
          if ! pkg-config --exists dbus-1; then
            echo "ERROR: dbus-1 not found by pkg-config"
            echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
            echo "Available dbus-related packages:"
            dpkg -l | grep dbus
            echo "Trying to locate dbus-1.pc file:"
            find /usr/lib -name "dbus-1.pc" 2>/dev/null || find /usr/share -name "dbus-1.pc" 2>/dev/null || echo "Not found"
            exit 1
          fi
          if ! pkg-config --exists glib-2.0; then
            echo "ERROR: glib-2.0 not found by pkg-config"
            echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
            echo "Available glib-related packages:"
            dpkg -l | grep glib
            echo "Trying to locate glib-2.0.pc file:"
            find /usr/lib -name "glib-2.0.pc" 2>/dev/null || find /usr/share -name "glib-2.0.pc" 2>/dev/null || echo "Not found"
            exit 1
          fi
          if ! pkg-config --exists cairo; then
            echo "ERROR: cairo not found by pkg-config"
            echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
            echo "Available cairo-related packages:"
            dpkg -l | grep cairo
            echo "Trying to locate cairo.pc file:"
            find /usr/lib -name "cairo.pc" 2>/dev/null || find /usr/share -name "cairo.pc" 2>/dev/null || echo "Not found"
            exit 1
          fi
          GI_MOD=""
          for mod in girepository-2.0 girepository-1.0 gobject-introspection-1.0; do
            if pkg-config --exists "$mod"; then
              GI_MOD="$mod"
              break
            fi
          done
          if [ -z "$GI_MOD" ]; then
            echo "ERROR: no girepository/gobject-introspection module found by pkg-config"
            echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
            echo "Available girepository-related packages:"
            dpkg -l | grep girepository
            echo "Available gir*-related packages:"
            dpkg -l | grep '^ii  gir'
            echo "Looking for any gir*.pc files:"
            find /usr/lib -name "gir*.pc" 2>/dev/null; find /usr/share -name "gir*.pc" 2>/dev/null
            exit 1
          fi
          echo "Using introspection module: $GI_MOD"
          echo "SUCCESS: All dependencies found by pkg-config"
          echo "dbus-1 CFLAGS: $(pkg-config --cflags dbus-1)"
          echo "dbus-1 LIBS: $(pkg-config --libs dbus-1)"
          echo "glib-2.0 CFLAGS: $(pkg-config --cflags glib-2.0)"
          echo "glib-2.0 LIBS: $(pkg-config --libs glib-2.0)"
          echo "cairo CFLAGS: $(pkg-config --cflags cairo)"
          echo "cairo LIBS: $(pkg-config --libs cairo)"
          echo "$GI_MOD CFLAGS: $(pkg-config --cflags "$GI_MOD")"
          echo "$GI_MOD LIBS: $(pkg-config --libs "$GI_MOD")"

      - name: Setup uv for locked dependencies
        if: inputs.install-dependencies && inputs.use-uv-lock
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Install locked dependencies
        if: inputs.install-dependencies && inputs.use-uv-lock
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          test -f pyproject.toml
          test -f uv.lock
          export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
          uv sync --locked --all-extras --python "$(command -v python)"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: inputs.install-dependencies && !inputs.use-uv-lock
        shell: bash
        run: |
          # Prefer binary wheels to avoid compilation issues when possible
          if [ -f pyproject.toml ]; then
            pip install --prefer-binary -e '.[dev,test]'
          elif [ -f requirements.txt ]; then
            pip install --prefer-binary -r requirements.txt
          elif [ -f requirements-dev.txt ]; then
            pip install --prefer-binary -r requirements-dev.txt
          fi

      - name: Run Ruff lint
        if: inputs.run-lint
        shell: bash
        run: python -m ruff check .

      - name: Run Ruff format check
        if: inputs.run-lint
        shell: bash
        run: python -m ruff format --check .

      - name: Install MyPy
        if: inputs.run-type-check
        shell: bash
        env:
          LOCKED_DEPENDENCIES: ${{ inputs.install-dependencies && inputs.use-uv-lock }}
        run: |
          if [[ "$LOCKED_DEPENDENCIES" == true ]]; then
            python -m mypy --version
          else
            python -m pip install mypy
          fi

      - name: Run MyPy type check
        if: inputs.run-type-check
        shell: bash
        run: python -m mypy .

      - name: Run Tests
        if: inputs.run-tests
        shell: bash
        run: |
          python -m pytest ${{ inputs.test-args }} --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }}

      - name: Upload coverage
        if: ${{ inputs.run-tests && inputs.coverage-artifact-name == '' }}
        # Integrity failures must stop the uploader; publication itself is optional.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Export coverage report
        if: ${{ inputs.run-tests && inputs.coverage-artifact-name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact-name }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: error
          retention-days: 7
