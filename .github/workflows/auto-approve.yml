name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: ./.github/workflows/auto-approve-reusable.yml
    with:
      pr-author: 'dependabot[bot],renovate[bot],4alvit'
      required-reviews: '0'
      pr-types: 'all'
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
