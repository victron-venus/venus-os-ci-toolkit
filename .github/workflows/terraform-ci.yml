name: 'Reusable Terraform CI'
# description: 'Reusable CI workflow for Terraform projects'
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      terraform-version:
        description: 'Terraform version'
        type: string
        default: '1.16.5'
      tflint-enabled:
        description: 'Whether to run TFLint'
        type: boolean
        default: true
jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  ci:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only' }}
    name: Terraform CI
    timeout-minutes: 15
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Verify selected Terraform version
        env:
          REQUESTED_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          requested = os.environ['REQUESTED_TERRAFORM_VERSION']
          result = subprocess.run(['terraform', 'version', '-json'], check=True, capture_output=True, text=True)
          actual = json.loads(result.stdout)['terraform_version']
          print(f'Terraform requested: {requested}; installed: {actual}')
          if re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', requested) and actual != requested:
              raise SystemExit('Installed Terraform does not match the requested version.')
          PY

      - name: Install checksum-verified TFLint
        if: inputs.tflint-enabled
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              arch=amd64
              checksum=cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
              ;;
            ARM64)
              arch=arm64
              checksum=560da89aacf59389d4eb029730dd5b109b7288096c32f2726a0d9e783a5ea8eb
              ;;
            *) echo 'Unsupported TFLint runner architecture.' >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/tflint.XXXXXX")"
          archive="$install_dir/tflint.zip"
          trap 'rm -f "$archive"' EXIT
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            "https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_${arch}.zip" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          unzip -q "$archive" tflint -d "$install_dir"
          chmod 0755 "$install_dir/tflint"
          "$install_dir/tflint" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # -backend=false: validate/lint never touch state, and remote backends
        # (e.g. Terraform Cloud) would demand credentials CI does not have.
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        if: inputs.tflint-enabled
        run: |
          tflint --init --enable-plugin=terraform
          tflint --enable-plugin=terraform
