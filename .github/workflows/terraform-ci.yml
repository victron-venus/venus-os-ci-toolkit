name: 'Reusable Terraform CI'
# description: 'Reusable CI workflow for Terraform projects'
on:
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      terraform-version:
        description: 'Terraform version'
        type: string
        default: '1.5.x'
      tflint-enabled:
        description: 'Whether to run TFLint'
        type: boolean
        default: true
jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  ci:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only' }}
    name: Terraform CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform-version: ${{ inputs.terraform-version }}
          terraform-wrapper: false

      - name: Install tflint
        if: inputs.tflint-enabled
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # -backend=false: validate/lint never touch state, and remote backends
        # (e.g. Terraform Cloud) would demand credentials CI does not have.
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        if: inputs.tflint-enabled
        run: tflint --init --enable-plugin=terraform
