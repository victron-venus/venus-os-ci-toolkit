# Repository-owned validation adapter; install_release.py composes its caller from .release-policy.json.
name: Contract tests
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  go-consumer-contract:
    name: Locked Go consumer workflow
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: tests/fixtures/go-minimal
      coverage-threshold: 100
      coverage-artifact-name: go-consumer-contract
  python-consumer-contract:
    name: Locked Python consumer workflow
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-minimal
      python-version: '3.12'
      use-uv-lock: true
      dependency-extras: 'dev,test'
      coverage-threshold: 100
      coverage-artifact-name: python-consumer-contract
  go-tools-contract:
    name: Pinned Go analysis tools (${{ matrix.go }}, lint v${{ matrix.lint }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.26.10'
            lint: '1'
          - go: '1.27.3'
            lint: '2'
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools through the public action
        uses: ./actions/setup-go
        with:
          go-version: ${{ matrix.go }}
          golangci-lint-major: ${{ matrix.lint }}
      - name: Analyze the Go consumer fixture
        working-directory: tests/fixtures/go-minimal
        run: |
          golangci-lint version
          govulncheck -mode=binary "$(command -v golangci-lint)"
          govulncheck -mode=binary "$(command -v govulncheck)"
          golangci-lint run ./...
          govulncheck ./...
          go test -race ./...
  runner-go-tool-contracts:
    name: Source-built runner tool (${{ matrix.component }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        component: [containerd, buildx, compose]
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select source and recipe changes
        id: changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          needed=$(python3 scripts/build_runner_go_tools.py --check-changes)
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.changes.outputs.needed == 'true'
        with:
          go-version: '1.26.10'
          cache-dependency-path: .github/containers/runner-go-tools/${{ matrix.component }}/go.sum
      - name: Test and compile the exact patched release source
        if: steps.changes.outputs.needed == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          TARGETARCH: amd64
        run: python3 scripts/build_runner_go_tools.py "$COMPONENT" --ci
      - name: Preserve source, package, license and binary-hash provenance
        if: steps.changes.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-go-tool-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/victron-go-tools-${{ matrix.component }}/output/notices/
          if-no-files-found: error
          retention-days: 14
  terraform-contract:
    name: Verified TFLint and Terraform validation
    uses: ./.github/workflows/terraform-ci.yml
    with:
      working-directory: tests/fixtures/terraform-minimal
      terraform-version: '1.16.5'
      tflint-enabled: true
  scorecard-contracts:
    name: Fail-closed Scorecard adapter contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: tools/scorecard-scan/go.sum
      - name: Test the scan-completeness and SARIF contracts
        working-directory: tools/scorecard-scan
        run: go test -mod=readonly ./...
  runner-admission-contracts:
    name: Exact runner qualification admission
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: tests/cel/go.sum
      - name: Evaluate emitted CEL against production and qualification fixtures
        working-directory: tests/cel
        run: go test -count=1 -mod=readonly ./...
  renovate-contracts:
    name: Atomic dependency update contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify runner dispatch with the GitHub expression engine
        run: |
          npm ci --prefix tools/runner-expressions --ignore-scripts --no-audit --no-fund
          node tools/runner-expressions/test.mjs
      - name: Install the same Renovate release as the scheduled runner
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".github/renovate-runtime.json"))["version"])')
          npm install --prefix "$RUNNER_TEMP/renovate" --ignore-scripts --no-audit --no-fund "renovate@$version"
      - name: Validate policy and exercise actual Renovate grouping
        env:
          RENOVATE_X_IGNORE_RE2: 'true'
        run: |
          renovate="$RUNNER_TEMP/renovate/node_modules/renovate"
          node "$renovate/dist/config-validator.js" --strict --no-global renovate-ci.json
          node tests/renovate_grouping.mjs "$renovate"
  python-typecheck-contract:
    name: Workflow contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install generator and contract test dependencies
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-generator.txt -r tools/secret_control/requirements-github-lock.txt'
      - name: Analyze Python source and tests
        run: python3 -m ruff check --config ruff.toml .
      - name: Install uv for locked dependency contracts
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - name: Exercise type checking and PR automation contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  python-action-contracts:
    uses: ./.github/workflows/python-action-tests.yml
  release-signer-contract:
    name: Patched release signer and TLS contract
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sigstore/cosign
          ref: 11926fa5bbbbde47e88fc006b625a17769b743b2
          path: .release-cosign-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: .github/cosign/go.sum
      - name: Build the reviewed patched release signer
        run: 'python3 scripts/build_release_signer.py --source .release-cosign-source --output "$RUNNER_TEMP/release-signer/cosign"

          echo "$RUNNER_TEMP/release-signer" >> "$GITHUB_PATH"

          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"

          '
      - name: Verify upstream signature and tamper rejection
        run: python3 scripts/check_release_signer.py "$RUNNER_TEMP/release-signer/cosign"
      - name: Test the actual binary against weak and strong certificate chains
        run: python3 scripts/check_release_signer_tls.py "$RUNNER_TEMP/release-signer/cosign"
      - name: Record the qualified signer inputs
        id: signer-receipt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from build_release_signer import GO_VERSION, SOURCE

          binary = Path(os.environ['RUNNER_TEMP']) / 'release-signer/cosign'
          def digest(path):
              with path.open('rb') as stream:
                  value = hashlib.file_digest(stream, 'sha256').hexdigest()
              return {'sha256': value, 'size_bytes': path.stat().st_size}

          metadata = subprocess.check_output(['go', 'version', '-m', str(binary)], text=True)
          toolchain = metadata.splitlines()[0].rsplit(' ', 1)[-1]
          settings = dict(line.split('\t')[2].split('=', 1)
                          for line in metadata.splitlines() if line.startswith('\tbuild\t') and '=' in line)
          jose = [line.split('\t')[3] for line in metadata.splitlines()
                  if line.startswith('\tdep\tgithub.com/go-jose/go-jose/v4\t')]
          upstream = subprocess.check_output(['git', '-C', '.release-cosign-source', 'rev-parse', 'HEAD'], text=True).strip()
          if (toolchain != GO_VERSION or upstream != SOURCE or jose != ['v4.1.6']
                  or settings.get('CGO_ENABLED') != '0'
                  or settings.get('GOOS') not in ('linux', 'darwin')
                  or settings.get('GOARCH') not in ('amd64', 'arm64')):
              raise SystemExit('Signer metadata does not match the qualified source/toolchain')
          inputs = ['.github/cosign/go.mod', '.github/cosign/go.sum',
                    'scripts/build_release_signer.py', 'scripts/check_release_signer.py',
                    'scripts/check_release_signer_tls.py']
          receipt = {
              'schema': 1, 'kind': 'unsigned-ci-qualification-receipt',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'], 'github_sha': os.environ['GITHUB_SHA'],
              'checkout_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'pull_request_head': os.environ.get('PR_HEAD_SHA') or None,
              'upstream_repository': 'sigstore/cosign', 'upstream_commit': upstream,
              'toolchain': toolchain, 'goos': settings['GOOS'], 'goarch': settings['GOARCH'],
              'cgo_enabled': settings['CGO_ENABLED'], 'go_jose': jose[0],
              'inputs': {name: digest(Path(name)) for name in inputs}, 'binary': digest(binary),
              'qualification': {'upstream_signature': True, 'tampered_payload_rejected': True,
                                'weak_and_strong_certificate_chains': True}}
          binary.with_name('receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('platform=' + settings['GOOS'] + '-' + settings['GOARCH'] + '\n')
          PY
      - name: Export only the qualified signer and its unsigned receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signer-${{ steps.signer-receipt.outputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-signer/cosign
            ${{ runner.temp }}/release-signer/receipt.json
          if-no-files-found: error
          retention-days: 7
  release-gh-contract:
    name: Qualified GitHub CLI and bootstrap TLS contract
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Verify installed version and executable identity
        run: python3 scripts/install_release_gh.py --check "$(command -v gh)"
      - name: Qualify actual CLI certificate chains
        run: python3 scripts/check_release_gh_tls.py "$RUNNER_TEMP/release-gh/gh"
      - name: Qualify actual bootstrap certificate chains
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: |-
          go build -p=2 -trimpath -o "$RUNNER_TEMP/release-gh-downloader" scripts/download_release_gh.go
          python3 scripts/check_release_gh_tls.py --downloader "$RUNNER_TEMP/release-gh-downloader"
'on':
  workflow_call: {}
