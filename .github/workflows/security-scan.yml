name: 'Reusable Security Scan'
# description: 'Reusable workflow for security scanning (CodeQL, Trivy, Dependency Review)'
on:
  workflow_call:
    inputs:
      languages:
        description: 'CodeQL languages to analyze'
        type: string
        default: 'python,javascript,go'
      working-directory:
        description: 'Working directory'
        type: string
        default: '.'
      run-codeql:
        description: 'Run CodeQL analysis'
        type: boolean
        default: true
      run-trivy:
        description: 'Run Trivy filesystem scan'
        type: boolean
        default: true
      run-dependency-review:
        description: 'Run dependency review'
        type: boolean
        default: true
      trivy-severity:
        description: 'Trivy severity threshold'
        type: string
        default: 'HIGH,CRITICAL'
jobs:
  codeql:
    name: CodeQL Analysis
    if: inputs.run-codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ inputs.languages }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: "/language:${{ inputs.languages }}"

  trivy:
    name: Trivy Scan
    if: inputs.run-trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (fixes GHSA-69fq-xp46-6x23)
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  dependency-review:
    name: Dependency Review
    if: inputs.run-dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high
