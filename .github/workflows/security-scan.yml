# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Reusable Security Scan
jobs:
  codeql:
    name: CodeQL Analysis
    if: inputs.run-codeql && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ inputs.languages }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: /language:${{ inputs.languages }}
    timeout-minutes: 30
  trivy:
    name: Trivy Scan
    if: inputs.run-trivy || github.event.repository.private == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: ${{ !inputs.strict-trivy }}
          scanners: ${{ inputs.strict-trivy && 'vuln,secret,misconfig' || 'vuln,secret' }}
          vuln-type: os,library
    timeout-minutes: 30
  dependency-review:
    name: Dependency Review
    if: inputs.run-dependency-review && github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
    timeout-minutes: 30
'on':
  workflow_call:
    inputs:
      languages:
        description: CodeQL languages to analyze
        type: string
        default: python,javascript,go
      working-directory:
        description: Working directory
        type: string
        default: .
      run-codeql:
        description: Run CodeQL analysis
        type: boolean
        default: true
      run-trivy:
        description: Run Trivy filesystem scan
        type: boolean
        default: true
      run-dependency-review:
        description: Run dependency review
        type: boolean
        default: true
      strict-trivy:
        description: Include unfixed findings and misconfiguration in mandatory gates
        type: boolean
        default: false
      trivy-severity:
        description: Trivy severity threshold
        type: string
        default: HIGH,CRITICAL
