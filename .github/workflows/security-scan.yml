# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Reusable Security Scan
jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  codeql:
    needs: change-scope
    name: CodeQL Analysis
    if: ${{ (inputs.run-codeql && github.event.repository.private == false) && (needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ inputs.languages }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ inputs.languages }}
    timeout-minutes: 30
  trivy:
    needs: change-scope
    name: Trivy Scan
    if: ${{ (inputs.run-trivy || github.event.repository.private == true) && (needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: ${{ !inputs.strict-trivy }}
          scanners: ${{ inputs.strict-trivy && 'vuln,secret,misconfig' || 'vuln,secret' }}
          vuln-type: os,library
    timeout-minutes: 30
  dependency-review:
    needs: change-scope
    name: Dependency Review
    if: ${{ (inputs.run-dependency-review && github.event.repository.private == false && github.event_name == 'pull_request') && (needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
    timeout-minutes: 30
'on':
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      languages:
        description: CodeQL languages to analyze
        type: string
        default: python,javascript,go
      working-directory:
        description: Working directory
        type: string
        default: .
      run-codeql:
        description: Run CodeQL analysis
        type: boolean
        default: true
      run-trivy:
        description: Run Trivy filesystem scan
        type: boolean
        default: true
      run-dependency-review:
        description: Run dependency review
        type: boolean
        default: true
      strict-trivy:
        description: Include unfixed findings and misconfiguration in mandatory gates
        type: boolean
        default: false
      trivy-severity:
        description: Trivy severity threshold
        type: string
        default: HIGH,CRITICAL
