name: Stage qualified OCI tool bytes

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed recipe commit; stages bytes without executing or publishing them
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: oci-tool-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stage:
    name: Verify and preserve original qualified bytes
    if: github.event_name == 'workflow_dispatch' && github.repository == 'victron-venus/venus-os-ci-toolkit' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.reviewed_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify workflow, artifacts, original archives and binary hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_oci_promotion.py
      - name: Preserve small acceptance index for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-staged-index
          path: ${{ runner.temp }}/oci-promotion/index.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original archives and prepared image contexts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-staged-bytes
          path: ${{ runner.temp }}/oci-promotion/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
