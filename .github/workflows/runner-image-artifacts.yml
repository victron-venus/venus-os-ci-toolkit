name: Build nondeployable runner image artifacts

'on':
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed consumer source commit
        required: true
        type: string

permissions:
  contents: read

env:
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}

concurrency:
  group: runner-image-artifacts
  cancel-in-progress: false

jobs:
  public:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'victron-venus/venus-os-ci-toolkit' && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Audit outbound connections
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build and scan public base with invalid site CA
        id: build_public
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_runner_image_artifacts.py public
      - name: Stage bounded proof files separately from images
        if: ${{ always() }}
        env:
          COMPLETE: ${{ steps.build_public.outcome == 'success' }}
        run: python3 scripts/stage_runner_evidence.py public --complete "$COMPLETE"
      - name: Preserve bounded runner evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image-evidence-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-image-evidence-public-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Preserve complete artifact or failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  private:
    needs: public
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Audit outbound connections
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout identical dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download exact same-run public input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and scan private-mode image from accepted public bytes
        id: build_private
        env:
          PARENT: ${{ runner.temp }}/runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_runner_image_artifacts.py private --parent "$PARENT"
      - name: Stage bounded proof files separately from images
        if: ${{ always() }}
        env:
          COMPLETE: ${{ steps.build_private.outcome == 'success' }}
        run: python3 scripts/stage_runner_evidence.py private --complete "$COMPLETE"
      - name: Preserve bounded runner evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image-evidence-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-image-evidence-private-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Preserve complete artifact or failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-image-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-image-private-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Require both full scans and verified image applicability
        env:
          PARENT: ${{ runner.temp }}/runner-image-public-${{ github.run_id }}-${{ github.run_attempt }}
          OUTPUT: ${{ runner.temp }}/runner-image-private-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/build_runner_image_artifacts.py gate --parent "$PARENT" --output "$OUTPUT"
