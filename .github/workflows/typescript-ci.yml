name: 'Reusable TypeScript CI'
# description: 'Reusable CI workflow for TypeScript projects (lint + typecheck + build + test)'
on:
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      run-node-ci:
        description: 'Run the existing lint/typecheck/build/test job; disable for a browser-only caller'
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      install-dependencies:
        description: 'Whether to install dependencies (npm ci)'
        type: boolean
        default: true
      run-lint:
        description: 'Whether to run linting'
        type: boolean
        default: true
      lint-command:
        description: 'Lint command'
        type: string
        default: 'npm run lint'
      run-type-check:
        description: 'Whether to run TypeScript type check'
        type: boolean
        default: true
      typecheck-command:
        description: 'Typecheck command'
        type: string
        default: 'npm run typecheck'
      run-build:
        description: 'Whether to run build'
        type: boolean
        default: true
      build-command:
        description: 'Build command'
        type: string
        default: 'npm run build'
      run-tests:
        description: 'Whether to run tests'
        type: boolean
        default: false
      test-command:
        description: 'Test command'
        type: string
        default: 'npm test'
      browser-matrix:
        description: 'Opt-in JSON array of reviewed browser targets; see docs/BROWSER_COMPATIBILITY.md'
        type: string
        default: '[]'
      browser-matrix-file:
        description: 'Optional checkout-relative JSON file instead of the inline browser matrix'
        type: string
        default: ''
      browser-extended:
        description: 'Include extended targets for scheduled, manual and RC qualification'
        type: boolean
        default: false
      browser-release-channel:
        description: 'Optional release qualification: nightly/beta require 5 targets, rc/stable require all 35'
        type: string
        default: ''
      browser-prepare-command:
        description: 'Prepare the application and synthetic fixtures in each browser job'
        type: string
        default: 'npm ci --ignore-scripts'
      browser-evidence-prefix:
        description: 'Unique artifact namespace when this workflow is called more than once per run'
        type: string
        default: 'browser-compatibility'
      browser-artifact-id:
        description: 'Optional exact artifact ID produced earlier in this workflow run'
        type: string
        default: ''
      browser-artifact-path:
        description: 'Checkout-relative destination for the exact candidate artifact'
        type: string
        default: ''
      browser-test-command:
        description: 'Application acceptance command using CI_PLAYWRIGHT_MODULE and writing CI_BROWSER_EVIDENCE'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  ci:
    needs: change-scope
    if: ${{ inputs.run-node-ci && (needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only') }}
    name: CI
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: ${{ inputs.install-dependencies }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.install-dependencies }}
        run: npm ci --ignore-scripts

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: ${{ inputs.lint-command }}

      - name: Typecheck
        if: ${{ inputs.run-type-check }}
        run: ${{ inputs.typecheck-command }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-command }}

      - name: Test
        if: ${{ inputs.run-tests }}
        run: ${{ inputs.test-command }}
  browser-plan:
    needs: change-scope
    if: ${{ (inputs.browser-matrix != '[]' || inputs.browser-matrix-file != '') && (needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only') }}
    name: Validate browser compatibility targets
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate and select the explicit compatibility inventory
        id: plan
        env:
          BROWSER_MATRIX: ${{ inputs.browser-matrix }}
          BROWSER_MATRIX_FILE: ${{ inputs.browser-matrix-file }}
          BROWSER_EXTENDED: ${{ inputs.browser-extended }}
          BROWSER_RELEASE_CHANNEL: ${{ inputs.browser-release-channel }}
          BROWSER_COMMAND: ${{ inputs.browser-test-command }}
          BROWSER_ARTIFACT_ID: ${{ inputs.browser-artifact-id }}
          BROWSER_EVIDENCE_PREFIX: ${{ inputs.browser-evidence-prefix }}
          BROWSER_ARTIFACT_PATH: ${{ inputs.browser-artifact-path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          let source = process.env.BROWSER_MATRIX;
          if (process.env.BROWSER_MATRIX_FILE) {
            if (source !== '[]') throw new Error('Use either matrix JSON or a matrix file');
            const root = fs.realpathSync(process.cwd());
            const file = fs.realpathSync(path.resolve(root, process.env.BROWSER_MATRIX_FILE));
            if (!file.startsWith(root + path.sep)) throw new Error('Matrix file escapes the checkout');
            source = fs.readFileSync(file, 'utf8');
          }
          if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(process.env.BROWSER_EVIDENCE_PREFIX)) throw new Error('Artifact evidence prefix must be a safe unique identifier');
          const artifactId = process.env.BROWSER_ARTIFACT_ID || '';
          const artifactPath = process.env.BROWSER_ARTIFACT_PATH || '';
          if (artifactId || artifactPath) {
            if (!/^[1-9][0-9]*$/.test(artifactId) || !/^(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(artifactPath)) throw new Error('Candidate artifact requires one exact numeric ID and a relative directory without traversal');
          }
          const rows = JSON.parse(source);
          const fail = message => { throw new Error(message); };
          if (!Array.isArray(rows) || !rows.length || rows.length > 96) fail('Expected 1..96 browser targets');
          if (!process.env.BROWSER_COMMAND.trim()) fail('Application acceptance command is required');
          const systems = new Set(['ubuntu-latest', 'ubuntu-24.04', 'windows-2022', 'macos-15', 'macos-15-intel']);
          const ids = new Set();
          const allowed = new Set(['id', 'os', 'engine', 'playwright', 'browser_version', 'toolchain', 'tier', 'channel']);
          for (const row of rows) {
            if (!row || Array.isArray(row) || typeof row !== 'object' || Object.keys(row).some(key => !allowed.has(key))) fail('Unknown browser target fields');
            if (typeof row.id !== 'string' || !/^[a-z0-9][a-z0-9-]{0,79}$/.test(row.id) || ids.has(row.id)) fail('Invalid or duplicate target id');
            ids.add(row.id);
            if (!systems.has(row.os) || !['chromium', 'firefox', 'webkit'].includes(row.engine)) fail('Unsupported platform or engine');
            if (typeof row.playwright !== 'string' || !/^\d+\.\d+\.\d+$/.test(row.playwright)) fail('Playwright must be an exact version');
            if (!['required', 'extended'].includes(row.tier)) fail('Target tier is required or extended');
            if (typeof row.toolchain !== 'string' || !/^(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(row.toolchain)) fail('Toolchain must be a relative directory without traversal');
            row.channel ??= '';
            if (!['', 'chrome', 'chrome-beta', 'msedge', 'msedge-beta'].includes(row.channel) || (row.channel && row.engine !== 'chromium')) fail('Invalid branded browser channel');
            if (row.channel ? row.browser_version !== 'installed' : typeof row.browser_version !== 'string' || !/^\d+(?:\.\d+){1,3}$/.test(row.browser_version)) fail('Pin the bundled browser version, or record the installed branded channel');
          }
          const selected = rows.filter(row => row.tier === 'required' || process.env.BROWSER_EXTENDED === 'true');
          if (!selected.length || !rows.some(row => row.tier === 'required')) fail('At least one required target is mandatory');
          const releaseChannel = process.env.BROWSER_RELEASE_CHANNEL || '';
          if (!['', 'nightly', 'beta', 'rc', 'stable'].includes(releaseChannel)) fail('Unknown browser release channel');
          if (releaseChannel) {
            const full = ['rc', 'stable'].includes(releaseChannel);
            if (rows.length !== 35 || rows.filter(row => row.tier === 'required').length !== 5) fail('Release qualification requires the reviewed 35-target inventory with 5 required targets');
            if ((process.env.BROWSER_EXTENDED === 'true') !== full || selected.length !== (full ? 35 : 5)) fail('Release channel does not match the required qualification breadth');
            const platformIdentity = os => os === 'macos-15-intel' ? 'macos-15' : os;
            const identity = row => JSON.stringify([platformIdentity(row.os), row.engine, row.playwright, row.channel]);
            const identities = new Set(rows.map(identity));
            if (identities.size !== rows.length) fail('Release inventory must not repeat a browser/platform/version identity');
            const bundled = rows.filter(row => !row.channel);
            const versions = [...new Set(bundled.map(row => row.playwright))].sort((a, b) => {
              const left = a.split('.').map(Number), right = b.split('.').map(Number);
              return left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
            });
            if (versions.length !== 3) fail('Release qualification requires three exact Playwright generations');
            const current = versions.at(-1);
            const platforms = ['ubuntu-latest', 'windows-2022', 'macos-15'];
            const engines = ['chromium', 'firefox', 'webkit'];
            const expected = new Map();
            for (const version of versions) for (const os of platforms) for (const engine of engines) {
              const required = version === current && (os === 'ubuntu-latest' || (os === 'windows-2022' && engine === 'chromium') || (os === 'macos-15' && engine === 'webkit'));
              expected.set(identity({os, engine, playwright: version, channel: ''}), required ? 'required' : 'extended');
            }
            for (const os of platforms) for (const channel of (os === 'ubuntu-latest' ? ['chrome', 'msedge', 'chrome-beta', 'msedge-beta'] : ['chrome', 'msedge'])) {
              expected.set(identity({os, engine: 'chromium', playwright: current, channel}), 'extended');
            }
            if (rows.some(row => expected.get(identity(row)) !== row.tier) || expected.size !== rows.length) fail('Release inventory must cover the complete three-OS, three-engine, three-generation product and current branded channels');
            for (const engine of engines) {
              const generations = versions.map(version => new Set(bundled.filter(row => row.engine === engine && row.playwright === version).map(row => row.browser_version)));
              if (generations.some(pins => pins.size !== 1) || new Set(generations.map(pins => [...pins][0])).size !== 3) fail('Each engine needs three distinct browser generations with consistent pins across OS targets');
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include: selected})}\n`);
          NODE
  browser:
    name: Browser (${{ matrix.id }})
    needs: [change-scope, browser-plan]
    if: ${{ needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.browser-plan.outputs.matrix) }}
    # Only the default Linux target may use the already-qualified Linux reserve.
    # Native OS targets must not silently collapse onto that pool.
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-latest' && (vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || format('["{0}"]', matrix.os)) }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      CI_BROWSER_TARGET: ${{ toJSON(matrix) }}
      CI_BROWSER_ENGINE: ${{ matrix.engine }}
      CI_BROWSER_CHANNEL: ${{ matrix.channel }}
      CI_BROWSER_EXPECTED_VERSION: ${{ matrix.browser_version }}
      CI_PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
      CI_BROWSER_TARGET_ID: ${{ matrix.id }}
      CI_BROWSER_RELEASE_CHANNEL: ${{ inputs.browser-release-channel }}
      CI_BROWSER_CANDIDATE_ARTIFACT_ID: ${{ inputs.browser-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate the isolated lock and actual runner platform
        id: lock
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const row = JSON.parse(process.env.CI_BROWSER_TARGET);
          const expected = row.os.startsWith('ubuntu-') ? 'linux' : row.os.startsWith('windows-') ? 'win32' : 'darwin';
          if (process.platform !== expected) throw new Error('Runner platform does not match the reviewed target');
          if (row.os === 'macos-15-intel' && process.arch !== 'x64') throw new Error('Intel macOS target requires an x64 runner');
          const root = fs.realpathSync(process.cwd());
          const directory = fs.realpathSync(path.resolve(root, row.toolchain));
          if (!directory.startsWith(root + path.sep)) throw new Error('Toolchain escapes the application directory');
          const pkg = JSON.parse(fs.readFileSync(path.join(directory, 'package.json')));
          const lock = JSON.parse(fs.readFileSync(path.join(directory, 'package-lock.json')));
          if (Object.keys(pkg.dependencies || {}).join() !== 'playwright' || pkg.dependencies.playwright !== row.playwright || Object.keys(pkg.devDependencies || {}).length) throw new Error('Toolchain must contain only exact Playwright');
          if (lock.lockfileVersion !== 3 || lock.packages?.['']?.dependencies?.playwright !== row.playwright) throw new Error('Missing matching npm lockfile v3');
          if (Object.keys(lock.packages).some(name => !['', 'node_modules/playwright', 'node_modules/playwright-core', 'node_modules/fsevents'].includes(name))) throw new Error('Unexpected packages in isolated browser toolchain');
          for (const name of ['playwright', 'playwright-core']) {
            const entry = lock.packages?.['node_modules/' + name];
            if (entry?.version !== row.playwright || entry.resolved !== `https://registry.npmjs.org/${name}/-/${name}-${row.playwright}.tgz` || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(entry.integrity || '')) throw new Error('Missing exact version and npm integrity for ' + name);
          }
          const output = path.resolve(root, '.compatibility', row.id);
          fs.mkdirSync(output, {recursive: true});
          const variables = {CI_PLAYWRIGHT_MODULE: path.join(directory, 'node_modules/playwright'), CI_BROWSER_EVIDENCE: path.join(output, 'result.json'), CI_BROWSER_DIAGNOSTICS: output, PLAYWRIGHT_BROWSERS_PATH: path.join(process.env.RUNNER_TEMP, 'compatibility-browsers'), CI_BROWSER_TOOLCHAIN: directory};
          for (const [key, value] of Object.entries(variables)) {
            if (/[\r\n]/.test(value)) throw new Error('Invalid environment value');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          fs.writeFileSync(path.join(output, 'target.json'), JSON.stringify(row, null, 2));
          NODE
      - name: Validate candidate artifact destination
        if: ${{ inputs.browser-artifact-id != '' }}
        env:
          BROWSER_ARTIFACT_PATH: ${{ inputs.browser-artifact-path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          const relative = process.env.BROWSER_ARTIFACT_PATH;
          if (!/^(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+$/.test(relative)) throw new Error('Invalid artifact destination');
          let current = root;
          for (const component of relative.split('/')) {
            current = path.join(current, component);
            try {
              const stat = fs.lstatSync(current);
              if (stat.isSymbolicLink() || !stat.isDirectory()) throw new Error('Artifact destination contains a link or non-directory');
              if (!fs.realpathSync(current).startsWith(root + path.sep)) throw new Error('Artifact destination escapes checkout');
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
            }
          }
          NODE
      - name: Download the exact candidate artifact from this workflow run
        if: ${{ inputs.browser-artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.browser-artifact-id }}
          path: ${{ inputs.browser-artifact-path }}
          merge-multiple: true
      - name: Prepare application acceptance fixtures
        env:
          PREPARE_COMMAND: ${{ inputs.browser-prepare-command }}
        run: bash -e -o pipefail -c "$PREPARE_COMMAND"
      - name: Install exact locked browser toolchain
        run: npm ci --prefix "$CI_BROWSER_TOOLCHAIN" --ignore-scripts --omit=optional --no-audit --no-fund
      # Playwright installs the Windows Media Foundation feature only through
      # its Chromium dependency group, but WebKit video playback needs it too.
      - name: Install Windows WebKit media dependencies
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Windows' && matrix.engine == 'webkit' }}
        run: node "$CI_PLAYWRIGHT_MODULE/cli.js" install-deps chromium
      - name: Install selected browser and hosted system dependencies
        if: runner.environment == 'github-hosted'
        run: node "$CI_PLAYWRIGHT_MODULE/cli.js" install --with-deps "${CI_BROWSER_CHANNEL:-$CI_BROWSER_ENGINE}"
      # Branded installers may run a system package manager even without --with-deps.
      # Reserve images must provision those channels before accepting jobs.
      - name: Install bundled browser on the prepared reserve
        if: ${{ runner.environment == 'self-hosted' && matrix.channel == '' }}
        run: node "$CI_PLAYWRIGHT_MODULE/cli.js" install "${CI_BROWSER_CHANNEL:-$CI_BROWSER_ENGINE}"
      - name: Check installed runtime identity
        id: identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const modulePath = process.env.CI_PLAYWRIGHT_MODULE;
            const version = require(path.join(modulePath, 'package.json')).version;
            if (version !== process.env.CI_PLAYWRIGHT_VERSION) throw new Error('Installed Playwright version differs from target');
            if (require(path.join(modulePath, '../playwright-core/package.json')).version !== version) throw new Error('Installed Playwright core version differs from target');
            const browser = await require(modulePath)[process.env.CI_BROWSER_ENGINE].launch({headless: true, ...(process.env.CI_BROWSER_CHANNEL ? {channel: process.env.CI_BROWSER_CHANNEL} : {})});
            try {
              const browserVersion = browser.version();
              if (!/^\d+(?:\.\d+){1,3}$/.test(browserVersion)) throw new Error('Browser did not report a version');
              if (!process.env.CI_BROWSER_CHANNEL && browserVersion !== process.env.CI_BROWSER_EXPECTED_VERSION) throw new Error(`Browser version differs: ${browserVersion}`);
              const receipt = {schema: 1, target: process.env.CI_BROWSER_TARGET_ID, engine: process.env.CI_BROWSER_ENGINE, channel: process.env.CI_BROWSER_CHANNEL, playwrightVersion: version, browserVersion, platform: process.platform, sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, releaseChannel: process.env.CI_BROWSER_RELEASE_CHANNEL || '', candidateArtifactId: process.env.CI_BROWSER_CANDIDATE_ARTIFACT_ID || ''};
              fs.writeFileSync(path.join(process.env.CI_BROWSER_DIAGNOSTICS, 'runtime.json'), JSON.stringify(receipt, null, 2));
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Run application browser acceptance
        env:
          ACCEPTANCE_COMMAND: ${{ inputs.browser-test-command }}
        run: |
          rm -f "$CI_BROWSER_EVIDENCE"
          bash -e -o pipefail -c "$ACCEPTANCE_COMMAND"
      - name: Require actual application test evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const runtime = JSON.parse(fs.readFileSync(path.join(process.env.CI_BROWSER_DIAGNOSTICS, 'runtime.json')));
          const result = JSON.parse(fs.readFileSync(process.env.CI_BROWSER_EVIDENCE));
          for (const [key, expected] of Object.entries(runtime)) {
            if (result[key] !== expected) throw new Error(`Application evidence differs from actual runtime: ${key}`);
          }
          if (!Number.isSafeInteger(result.testsPassed) || result.testsPassed < 1 || result.testsFailed !== 0) throw new Error('No passing application acceptance tests, or failed tests remain');
          if (!Array.isArray(result.scenarios) || result.scenarios.length !== result.testsPassed || result.scenarios.some(value => typeof value !== 'string' || !value.trim()) || new Set(result.scenarios).size !== result.scenarios.length) throw new Error('Each passed application scenario must be named exactly once');
          NODE
      - name: Preserve browser versions and synthetic failure diagnostics
        if: ${{ always() && steps.lock.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.browser-evidence-prefix }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/.compatibility/${{ matrix.id }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  browser-verdict:
    name: Verify release browser qualification
    needs: [browser-plan, browser]
    if: ${{ !cancelled() && inputs.browser-release-channel != '' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require all browser jobs to succeed
        env:
          PLAN_RESULT: ${{ needs.browser-plan.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PLAN_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download qualification evidence from this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.browser-evidence-prefix }}-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-release-evidence
          merge-multiple: false
      - name: Verify the exact release target set and evidence identity
        env:
          BROWSER_MATRIX: ${{ needs.browser-plan.outputs.matrix }}
          BROWSER_RELEASE_CHANNEL: ${{ inputs.browser-release-channel }}
          BROWSER_ARTIFACT_ID: ${{ inputs.browser-artifact-id }}
          BROWSER_EVIDENCE_PREFIX: ${{ inputs.browser-evidence-prefix }}
          BROWSER_EVIDENCE_DIRECTORY: ${{ runner.temp }}/browser-release-evidence
          BROWSER_VERDICT_FILE: ${{ runner.temp }}/browser-release-verdict.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const fail = message => { throw new Error(message); };
          const releaseChannel = process.env.BROWSER_RELEASE_CHANNEL;
          if (!['nightly', 'beta', 'rc', 'stable'].includes(releaseChannel)) fail('Unknown release channel');
          const rows = JSON.parse(process.env.BROWSER_MATRIX).include;
          const full = ['rc', 'stable'].includes(releaseChannel);
          if (!Array.isArray(rows) || rows.length !== (full ? 35 : 5) || new Set(rows.map(row => row.id)).size !== rows.length) fail('Incorrect or duplicate release target set');
          if (rows.filter(row => row.tier === 'required').length !== 5 || (!full && rows.some(row => row.tier !== 'required'))) fail('Incorrect required release targets');
          const binding = {schema: 1, sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, releaseChannel, candidateArtifactId: process.env.BROWSER_ARTIFACT_ID || ''};
          const directory = process.env.BROWSER_EVIDENCE_DIRECTORY;
          const artifactName = row => `${process.env.BROWSER_EVIDENCE_PREFIX}-${row.id}-${binding.runAttempt}`;
          const expectedNames = rows.map(artifactName).sort();
          const actualNames = fs.readdirSync(directory).sort();
          if (JSON.stringify(expectedNames) !== JSON.stringify(actualNames)) fail('Missing, duplicate or unexpected qualification evidence');
          const read = (folder, name) => {
            const file = path.join(folder, name);
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 1024 * 1024) fail('Evidence must be a bounded regular JSON file');
            const bytes = fs.readFileSync(file);
            return {data: JSON.parse(bytes), digest: crypto.createHash('sha256').update(bytes).digest('hex')};
          };
          const targets = rows.map(row => {
            const folder = path.join(directory, artifactName(row));
            if (!fs.lstatSync(folder).isDirectory() || fs.lstatSync(folder).isSymbolicLink()) fail('Evidence directory must not be a link');
            const target = read(folder, 'target.json').data;
            if (Object.keys(target).length !== Object.keys(row).length || Object.entries(row).some(([key, value]) => target[key] !== value)) fail('Evidence target differs from the admitted inventory');
            const runtime = read(folder, 'runtime.json').data;
            const {data: result, digest} = read(folder, 'result.json');
            const platform = row.os.startsWith('ubuntu-') ? 'linux' : row.os.startsWith('windows-') ? 'win32' : 'darwin';
            const expected = {...binding, target: row.id, engine: row.engine, channel: row.channel, playwrightVersion: row.playwright, platform};
            for (const [key, value] of Object.entries(expected)) {
              if (runtime[key] !== value || result[key] !== value) fail(`Qualification identity mismatch: ${row.id}/${key}`);
            }
            if (!/^\d+(?:\.\d+){1,3}$/.test(runtime.browserVersion) || (!row.channel && runtime.browserVersion !== row.browser_version) || result.browserVersion !== runtime.browserVersion) fail('Wrong actual browser version');
            if (!Number.isSafeInteger(result.testsPassed) || result.testsPassed < 1 || result.testsFailed !== 0 || !Array.isArray(result.scenarios) || result.scenarios.length !== result.testsPassed || new Set(result.scenarios).size !== result.scenarios.length || result.scenarios.some(name => typeof name !== 'string' || !name.trim())) fail('Missing or failed application scenarios');
            return {id: row.id, os: row.os, engine: row.engine, channel: row.channel, playwrightVersion: runtime.playwrightVersion, browserVersion: runtime.browserVersion, testsPassed: result.testsPassed, scenarios: result.scenarios, evidenceSha256: digest};
          });
          fs.writeFileSync(process.env.BROWSER_VERDICT_FILE, JSON.stringify({...binding, targets}, null, 2) + '\n');
          NODE
      - name: Preserve verified release qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.browser-evidence-prefix }}-verdict-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-release-verdict.json
          if-no-files-found: error
          retention-days: 14
