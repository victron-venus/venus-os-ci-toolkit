name: Auto Approve

on:
  workflow_call:
    inputs:
      authors:
        description: JSON array of trusted PR authors eligible for automatic approval
        type: string
        default: '["dependabot[bot]","renovate[bot]","4alvit","californiantiramisu"]'
    secrets:
      BOT_PAT:
        description: Independent reviewer token for PRs not authored by Dependabot
        required: false
      APPROVAL_PAT:
        description: Optional separate reviewer token when BOT_PAT owns the PR
        required: false

jobs:
  auto-approve:
    name: Auto Approve
    if: >-
      github.event.pull_request != null &&
      contains(fromJSON(inputs.authors), github.event.pull_request.user.login) &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This workflow handles metadata only. Never check out or execute PR code.
      - name: Approve the current head as an independent reviewer
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.token || '' }}
          BOT_PAT: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && secrets.BOT_PAT || '' }}
          APPROVAL_PAT: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && secrets.APPROVAL_PAT || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_AUTHORS: ${{ inputs.authors }}
        run: |
          import json
          import os
          import subprocess

          def api(path, token, *, payload=None, paginate=False):
              command = ["gh", "api", path]
              if paginate:
                  command.extend(["--paginate", "--slurp"])
              if payload is not None:
                  command.extend(["--method", "POST", "--input", "-"])
              try:
                  result = subprocess.run(
                      command,
                      input=json.dumps(payload) if payload is not None else None,
                      text=True,
                      capture_output=True,
                      check=True,
                      env={**os.environ, "GH_TOKEN": token},
                  )
              except subprocess.CalledProcessError as error:
                  detail = (error.stderr or "GitHub API request failed").strip().replace(token, "***")
                  raise RuntimeError(detail) from None
              return json.loads(result.stdout)

          def eligible(pr, authors, repository, default_branch):
              return (
                  pr["state"] == "open"
                  and not pr["draft"]
                  and pr["user"]["login"].lower() in authors
                  and pr["base"]["repo"]["full_name"] == repository
                  and pr["base"]["ref"] == default_branch
              )

          def review_decision(repository, number, token):
              owner, name = repository.split("/", 1)
              result = api("graphql", token, payload={
                  "query": "query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}",
                  "variables": {"owner": owner, "name": name, "number": number},
              })
              if result.get("errors"):
                  raise RuntimeError("GitHub could not determine the current review decision")
              return result["data"]["repository"]["pullRequest"]["reviewDecision"]

          def main():
              dependabot = os.environ.get("PR_AUTHOR") == "dependabot[bot]"
              token = (os.environ.get("GITHUB_TOKEN") if dependabot else
                       os.environ.get("BOT_PAT") or os.environ.get("APPROVAL_PAT"))
              if not token:
                  if dependabot:
                      raise RuntimeError("GITHUB_TOKEN is missing for Dependabot approval")
                  raise RuntimeError("Configure BOT_PAT or APPROVAL_PAT with pull request write permission")
              authors = {author.lower() for author in json.loads(os.environ["TRUSTED_AUTHORS"])}
              repository = os.environ["GITHUB_REPOSITORY"]
              number = int(os.environ["PR_NUMBER"])
              endpoint = f"repos/{repository}/pulls/{number}"
              default_branch = api(f"repos/{repository}", token)["default_branch"]
              pr = api(endpoint, token)
              if not eligible(pr, authors, repository, default_branch):
                  print("Pull request is not eligible for automatic approval")
                  return
              if dependabot != (pr["user"]["login"] == "dependabot[bot]"):
                  raise RuntimeError("Pull request author does not match the selected credential")
              # Installation tokens cannot call the user-token-only GET /user endpoint.
              reviewer = "github-actions[bot]" if dependabot else api("user", token)["login"]
              fallback = None if dependabot else os.environ.get("APPROVAL_PAT")
              if reviewer.lower() == pr["user"]["login"].lower() and fallback and fallback != token:
                  token = fallback
                  reviewer = api("user", token)["login"]
              if reviewer.lower() == pr["user"]["login"].lower():
                  raise RuntimeError("The reviewer cannot approve its own PR; configure an independent APPROVAL_PAT")
              print(f"Reviewer: {reviewer}")
              reviews = [
                  review
                  for page in api(f"{endpoint}/reviews?per_page=100", token, paginate=True)
                  for review in page
                  if review["user"]["login"].lower() == reviewer.lower()
                  and review["state"] != "PENDING"
              ]
              head = pr["head"]["sha"]
              base_endpoint = f"repos/{repository}/git/ref/heads/{default_branch}"
              base = api(base_endpoint, token)["object"]["sha"]
              marker = f"<!-- toolkit-approval-base:{base}:pr-base:{pr['base']['sha']} -->"
              same_head_approval = (
                  reviews and reviews[-1]["state"] == "APPROVED"
                  and reviews[-1]["commit_id"] == head
              )
              if same_head_approval:
                  if (review_decision(repository, number, token) != "REVIEW_REQUIRED"
                          or marker in (reviews[-1].get("body") or "")):
                      print("The current head is already approved by this reviewer")
                      return
              current = api(endpoint, token)
              current_base = api(base_endpoint, token)["object"]["sha"]
              if (current["head"]["sha"] != head or current_base != base
                      or current["base"]["sha"] != pr["base"]["sha"]
                      or not eligible(current, authors, repository, default_branch)):
                  print("Pull request changed; a new event will evaluate the current head")
                  return
              if same_head_approval and review_decision(repository, number, token) != "REVIEW_REQUIRED":
                  print("The review requirement changed; no duplicate approval is needed")
                  return
              api(f"{endpoint}/reviews", token, payload={
                  "event": "APPROVE", "commit_id": head,
                  "body": f"Approved the current head against base commit {base}.\n\n{marker}",
              })
              print(f"Approved pull request #{number} at {head}")

          if __name__ == "__main__":
              main()
