name: 'Auto Approve'
description: 'Auto-approve PRs opened by configured authors'

on:
  workflow_call:
    inputs:
      pr-author:
        description: 'Comma-separated PR authors to auto-approve (exact login, no spaces)'
        type: string
        default: 'dependabot[bot],renovate[bot],4alvit'
    secrets:
      BOT_PAT:
        description: 'GitHub token (BOT_PAT) for approving PRs; falls back to github.token'
        required: false

jobs:
  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    # auto-approve-action v4 cannot filter by author/type, so gate here.
    if: contains(split(inputs.pr-author, ','), github.actor)
    steps:
      - name: Auto Approve
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363
        with:
          github-token: ${{ secrets.BOT_PAT || github.token }}
