name: 'Auto Approve'
description: 'Auto-approve PRs opened by configured authors'

on:
  workflow_call:
    inputs:
      pr-author:
        description: 'Unused, kept for caller compatibility'
        type: string
        default: 'dependabot[bot],renovate[bot],4alvit'
      pr_author_json:
        description: 'JSON array of PR authors to auto-approve'
        type: string
        default: '["dependabot[bot]","renovate[bot]","4alvit"]'
      required-reviews:
        description: 'Unused, kept for caller compatibility'
        type: string
        default: '1'
      pr-types:
        description: 'Unused, kept for caller compatibility'
        type: string
        default: 'dependencies'
    secrets:
      BOT_PAT:
        description: 'GitHub token (BOT_PAT) for approving PRs; falls back to github.token'
        required: false

jobs:
  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Auto Approve
        if: contains(fromJSON(inputs.pr_author_json), github.actor)
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363
        with:
          github-token: ${{ secrets.BOT_PAT || github.token }}
