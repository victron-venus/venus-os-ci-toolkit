name: 'Auto Approve'
description: 'Auto-approve Dependabot and Renovate PRs'

on:
  workflow_call:
    inputs:
      review-message:
        description: 'Review message for auto-approval'
        type: string
        default: 'Auto-approved by CI'
    secrets:
      GITHUB_TOKEN:
        description: 'GitHub token for approving PRs'
        required: true
    jobs:
      auto-approve:
        name: Auto Approve
        runs-on: ubuntu-latest
        permissions:
          contents: read
          pull-requests: write
        steps:
          - name: Auto Approve
            uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
              review-message: ${{ inputs.review-message }}