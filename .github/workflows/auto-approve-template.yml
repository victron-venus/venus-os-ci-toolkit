name: 'Auto Approve PRs'
# description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    # Call the REUSABLE workflow (workflow_call), not auto-approve.yml,
    # which is itself a pull_request-triggered caller and cannot be reused.
    # Pin to specific SHA for supply-chain security.
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@4eaa91b6cdcc192a7ac3bc9d074042f70eb403cc
    with:
      authors: '["dependabot[bot]","renovate[bot]","4alvit"]'
    # BOT_PAT must be forwarded explicitly (reusable workflows receive no
    # secrets by default) and must belong to an account OTHER than the
    # authors listed above.
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
