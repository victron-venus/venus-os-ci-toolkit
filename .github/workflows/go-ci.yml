name: 'Reusable Go CI'
description: 'Reusable CI workflow for Go projects'
on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version'
        type: string
        default: '1.23'
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      run-lint:
        description: 'Whether to run linting (golangci-lint)'
        type: boolean
        default: true
      run-tests:
        description: 'Whether to run tests'
        type: boolean
        default: true
      test-args:
        description: 'Additional go test arguments'
        type: string
        default: '-race -coverprofile=coverage.out -covermode=atomic'
      coverage-threshold:
        description: 'Minimum coverage percentage'
        type: number
        default: 70
      run-vulncheck:
        description: 'Whether to run govulncheck'
        type: boolean
        default: true
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: victron-venus/venus-os-ci-toolkit/actions/setup-go@6da015c8cece60541100e55c14829f2c34a01d6e
        with:
          go-version: ${{ inputs.go-version }}

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run golangci-lint
        if: inputs.run-lint
        shell: bash
        run: golangci-lint run ./...

      - name: Run govulncheck
        if: inputs.run-vulncheck
        shell: bash
        run: govulncheck ./...

      - name: Run Tests
        if: inputs.run-tests
        shell: bash
        run: go test ${{ inputs.test-args }} ./...

      - name: Check coverage threshold
        if: inputs.run-tests
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < ${{ inputs.coverage-threshold }}" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold ${{ inputs.coverage-threshold }}%"
            exit 1
          fi

      - name: Upload coverage
        if: inputs.run-tests
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
