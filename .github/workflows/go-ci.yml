name: 'Reusable Go CI'
# description: 'Reusable CI workflow for Go projects'
on:
  workflow_call:
    inputs:
      force-full:
        description: Keep full validation; set false only for ordinary change-aware CI
        type: boolean
        default: true
      documentation-paths:
        description: JSON array of additional exact documentation paths
        type: string
        default: '[]'
      required-paths:
        description: JSON array of exact paths that always require full validation
        type: string
        default: '[]'
      go-version:
        description: 'Go version'
        type: string
        default: '1.23'
      working-directory:
        description: 'Working directory for the project'
        type: string
        default: '.'
      run-lint:
        description: 'Whether to run linting (golangci-lint)'
        type: boolean
        default: true
      run-tests:
        description: 'Whether to run tests'
        type: boolean
        default: true
      test-args:
        description: 'Additional go test arguments'
        type: string
        default: '-race -coverprofile=coverage.out -covermode=atomic'
      coverage-threshold:
        description: 'Minimum coverage percentage'
        type: number
        default: 70
      coverage-artifact-name:
        description: 'Export the existing coverage report under this artifact base name; empty keeps legacy inline upload'
        type: string
        default: ''
      run-vulncheck:
        description: 'Whether to run govulncheck'
        type: boolean
        default: true
jobs:
  change-scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      force-full: ${{ inputs.force-full }}
      documentation-paths: ${{ inputs.documentation-paths }}
      required-paths: ${{ inputs.required-paths }}
  ci:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run != 'false' || needs.change-scope.outputs.reason != 'documentation-only' }}
    name: CI
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: victron-venus/venus-os-ci-toolkit/actions/setup-go@062d60e8892d4a97e11f5985d0914d5b19fcd24e # main
        with:
          go-version: ${{ inputs.go-version }}

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run golangci-lint
        if: inputs.run-lint
        shell: bash
        run: golangci-lint run ./...

      - name: Run govulncheck
        if: inputs.run-vulncheck
        shell: bash
        run: govulncheck ./...

      - name: Run Tests
        if: inputs.run-tests
        shell: bash
        run: go test ${{ inputs.test-args }} ./...

      - name: Check coverage threshold
        if: inputs.run-tests
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < ${{ inputs.coverage-threshold }}" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold ${{ inputs.coverage-threshold }}%"
            exit 1
          fi

      - name: Upload coverage
        if: ${{ inputs.run-tests && inputs.coverage-artifact-name == '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Export coverage report
        if: ${{ inputs.run-tests && inputs.coverage-artifact-name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact-name }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/coverage.out
          if-no-files-found: error
          retention-days: 7
