name: Documentation checks

# Callers opt in from their own workflow; nothing here runs by itself.
#
#   jobs:
#     docs:
#       uses: victron-venus/venus-os-ci-toolkit/.github/workflows/docs-check.yml@<40-char-sha>
#
# The checker itself lives in this toolkit. The caller supplies only its own
# rules: which checks to run, and whether an index is required. That keeps one
# implementation while still allowing a repository to keep a local invariant
# that the shared checker does not express.
on:
  workflow_call:
    inputs:
      checks:
        description: Comma-separated rule names or "all"
        type: string
        default: links,anchors,svg,index,fences,mermaid
      python-version:
        description: Python version for the checker
        type: string
        default: '3.12'
      toolkit-ref:
        description: Immutable toolkit commit that supplies the checker
        type: string
        required: true
permissions:
  contents: read
jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/venus-os-ci-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false
          sparse-checkout: scripts/check_docs.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run the shared checker
        working-directory: project
        env:
          CHECKS: ${{ inputs.checks }}
        run: python ../toolkit/scripts/check_docs.py --root . --checks "$CHECKS"
