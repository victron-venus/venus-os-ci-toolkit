<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc"><title id="title">From quick feedback to qualified stable bytes</title><desc id="desc">PR and beta run five browser targets. RC runs all thirty-five. Stable either copies accepted RC bytes or rebuilds and passes all thirty-five. Exact evidence is required.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#70b7ff"/></marker></defs><rect width="1360" height="620" rx="24" fill="#0b1220"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="56" font-size="32" font-weight="700" fill="#eef5ff">From quick feedback to qualified stable bytes</text><text x="40" y="91" font-size="20" font-weight="400" fill="#a8bdd8">Release channel controls required browser breadth; existing native and security checks remain required.</text><rect x="40" y="130" width="275" height="265" rx="18" fill="#142139" stroke="#70b7ff" stroke-width="2"/><text x="60" y="168" font-size="24" font-weight="700" fill="#eef5ff">PR / merge queue</text><text x="60" y="227" font-size="46" font-weight="700" fill="#70b7ff">5</text><text x="60" y="258" font-size="20" font-weight="400" fill="#a8bdd8">required targets</text><text x="60" y="310" font-size="18" font-weight="400" fill="#eef5ff">Real application flows</text><text x="60" y="339" font-size="18" font-weight="400" fill="#eef5ff">Fast, mandatory feedback</text><text x="60" y="368" font-size="18" font-weight="400" fill="#eef5ff">Source audit: no release claim</text><rect x="375" y="130" width="275" height="265" rx="18" fill="#142139" stroke="#bfadff" stroke-width="2"/><text x="395" y="168" font-size="24" font-weight="700" fill="#eef5ff">Nightly / beta</text><text x="395" y="227" font-size="46" font-weight="700" fill="#bfadff">5</text><text x="395" y="258" font-size="20" font-weight="400" fill="#a8bdd8">required targets</text><text x="395" y="310" font-size="18" font-weight="400" fill="#eef5ff">Same mandatory subset</text><text x="395" y="339" font-size="18" font-weight="400" fill="#eef5ff">Channel-bound evidence</text><text x="395" y="368" font-size="18" font-weight="400" fill="#eef5ff">Fast iteration before RC</text><rect x="710" y="130" width="275" height="265" rx="18" fill="#142139" stroke="#64dfb2" stroke-width="2"/><text x="730" y="168" font-size="24" font-weight="700" fill="#eef5ff">Release candidate</text><text x="730" y="227" font-size="46" font-weight="700" fill="#64dfb2">35</text><text x="730" y="258" font-size="20" font-weight="400" fill="#a8bdd8">required targets</text><text x="730" y="310" font-size="18" font-weight="400" fill="#eef5ff">Exact candidate artifact</text><text x="730" y="339" font-size="18" font-weight="400" fill="#eef5ff">Every version × OS target</text><text x="730" y="368" font-size="18" font-weight="400" fill="#eef5ff">No missing or skipped results</text><rect x="1045" y="130" width="275" height="265" rx="18" fill="#142139" stroke="#ffce75" stroke-width="2"/><text x="1065" y="168" font-size="24" font-weight="700" fill="#eef5ff">Stable</text><text x="1065" y="227" font-size="46" font-weight="700" fill="#ffce75">2 paths</text><text x="1065" y="258" font-size="20" font-weight="400" fill="#a8bdd8">project policy</text><text x="1065" y="310" font-size="18" font-weight="400" fill="#eef5ff">Copy accepted RC bytes</text><text x="1065" y="339" font-size="18" font-weight="400" fill="#eef5ff">or rebuild and qualify all 35</text><text x="1065" y="368" font-size="18" font-weight="400" fill="#eef5ff">No beta-only promotion</text><path d="M325 244 L363 244" fill="none" stroke="#70b7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M660 244 L698 244" fill="none" stroke="#70b7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M995 244 L1033 244" fill="none" stroke="#70b7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="432" width="1280" height="94" rx="18" fill="#142139" stroke="#64dfb2" stroke-width="2"/><text x="64" y="469" font-size="23" font-weight="700" fill="#64dfb2">PASS requires real evidence, not only a green counter</text><text x="64" y="503" font-size="20" font-weight="400" fill="#eef5ff">Exact target set + actual browser + source SHA + run / attempt + release channel + candidate artifact ID</text><text x="40" y="578" font-size="20" font-weight="400" fill="#ffce75">Configured qualification policy. A full 35-target RC run is still required before claiming full qualification.</text></g></svg>
