<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="635" viewBox="0 0 1360 635" role="img" aria-labelledby="title desc"><title id="title">A release verdict built from actual browser evidence</title><desc id="desc">The planner admits a precise target set and candidate. Every target records its runtime and named application results. The release verdict rejects missing, foreign, duplicate or stale evidence and binds the result to the source, candidate artifact, channel, run and attempt.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#70b7ff"/></marker></defs><rect width="1360" height="635" rx="24" fill="#0b1220"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="56" font-size="32" font-weight="700" fill="#eef5ff">A release verdict built from actual browser evidence</text><text x="40" y="91" font-size="20" font-weight="400" fill="#a8bdd8">Each release result must prove it belongs to the admitted candidate and this exact execution.</text><rect x="40" y="135" width="300" height="260" rx="18" fill="#142139" stroke="#70b7ff" stroke-width="2"/><text x="64" y="176" font-size="25" font-weight="700" fill="#70b7ff">Admitted inputs</text><text x="64" y="223" font-size="20" font-weight="400" fill="#eef5ff">Reviewed 35-target inventory</text><text x="64" y="265" font-size="20" font-weight="400" fill="#eef5ff">Channel → exact 5 or 35 set</text><text x="64" y="307" font-size="20" font-weight="400" fill="#eef5ff">Source SHA</text><text x="64" y="349" font-size="20" font-weight="400" fill="#eef5ff">Exact build artifact ID</text><path d="M347 262 L393 262" fill="none" stroke="#70b7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="408" y="135" width="520" height="260" rx="18" fill="#142139" stroke="#64dfb2" stroke-width="2"/><text x="433" y="176" font-size="25" font-weight="700" fill="#64dfb2">Evidence from every real target</text><text x="433" y="223" font-size="20" font-weight="400" fill="#eef5ff">target.json → admitted OS / engine / version</text><text x="433" y="265" font-size="20" font-weight="400" fill="#eef5ff">runtime.json → actual browser and run identity</text><text x="433" y="307" font-size="20" font-weight="400" fill="#eef5ff">result.json → named, passing application flows</text><text x="433" y="349" font-size="20" font-weight="400" fill="#eef5ff">Same source, channel, artifact, run and attempt</text><path d="M937 262 L980 262" fill="none" stroke="#70b7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="135" width="325" height="260" rx="18" fill="#142139" stroke="#bfadff" stroke-width="2"/><text x="1020" y="176" font-size="25" font-weight="700" fill="#bfadff">Release verdict</text><text x="1020" y="223" font-size="20" font-weight="400" fill="#eef5ff">All matrix jobs succeeded</text><text x="1020" y="265" font-size="20" font-weight="400" fill="#eef5ff">Exact evidence set present</text><text x="1020" y="307" font-size="20" font-weight="400" fill="#eef5ff">Every binding matches</text><text x="1020" y="349" font-size="20" font-weight="400" fill="#eef5ff">Per-result SHA-256 recorded</text><rect x="40" y="432" width="1280" height="112" rx="18" fill="#142139" stroke="#ffce75" stroke-width="2"/><text x="64" y="469" font-size="24" font-weight="700" fill="#ffce75">Fail closed</text><text x="64" y="503" font-size="20" font-weight="400" fill="#eef5ff">Missing / duplicate / foreign / stale evidence, a skipped target or a wrong browser prevents qualification.</text><text x="64" y="530" font-size="19" font-weight="400" fill="#a8bdd8">After a failed qualification, rerun the whole workflow; previous-attempt results cannot fill the gaps.</text><text x="40" y="592" font-size="20" font-weight="400" fill="#a8bdd8">Source audits keep the release channel empty and do not produce a release qualification verdict.</text></g></svg>
