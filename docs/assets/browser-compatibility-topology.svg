<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" viewBox="0 0 1360 660" role="img" aria-labelledby="title desc"><title id="title">35 targets, with a deliberate five-target fast path</title><desc id="desc">A three by three grid covers Linux, Windows and macOS with Chromium, Firefox and WebKit, each in three pinned generations. Eight branded channel targets bring the total to thirty-five. Five current targets form the required subset.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#70b7ff"/></marker></defs><rect width="1360" height="660" rx="24" fill="#0b1220"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="56" font-size="32" font-weight="700" fill="#eef5ff">35 targets, with a deliberate five-target fast path</text><text x="40" y="91" font-size="20" font-weight="400" fill="#a8bdd8">Three pinned generations for each bundled engine on each native operating system.</text><text x="340" y="139" font-size="24" font-weight="700" fill="#70b7ff">Chromium</text><text x="675" y="139" font-size="24" font-weight="700" fill="#bfadff">Firefox</text><text x="1010" y="139" font-size="24" font-weight="700" fill="#64dfb2">WebKit</text><text x="50" y="213" font-size="24" font-weight="700" fill="#eef5ff">Linux</text><rect x="270" y="163" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="297" cy="203" r="7" fill="#70b7ff"/><circle cx="321" cy="203" r="7" fill="#70b7ff"/><circle cx="345" cy="203" r="7" fill="#70b7ff"/><text x="370" y="209" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><circle cx="550" cy="179" r="7" fill="#ffce75"/><rect x="605" y="163" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="632" cy="203" r="7" fill="#bfadff"/><circle cx="656" cy="203" r="7" fill="#bfadff"/><circle cx="680" cy="203" r="7" fill="#bfadff"/><text x="705" y="209" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><circle cx="885" cy="179" r="7" fill="#ffce75"/><rect x="940" y="163" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="967" cy="203" r="7" fill="#64dfb2"/><circle cx="991" cy="203" r="7" fill="#64dfb2"/><circle cx="1015" cy="203" r="7" fill="#64dfb2"/><text x="1040" y="209" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><circle cx="1220" cy="179" r="7" fill="#ffce75"/><text x="50" y="313" font-size="24" font-weight="700" fill="#eef5ff">Windows</text><rect x="270" y="263" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="297" cy="303" r="7" fill="#70b7ff"/><circle cx="321" cy="303" r="7" fill="#70b7ff"/><circle cx="345" cy="303" r="7" fill="#70b7ff"/><text x="370" y="309" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><circle cx="550" cy="279" r="7" fill="#ffce75"/><rect x="605" y="263" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="632" cy="303" r="7" fill="#bfadff"/><circle cx="656" cy="303" r="7" fill="#bfadff"/><circle cx="680" cy="303" r="7" fill="#bfadff"/><text x="705" y="309" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><rect x="940" y="263" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="967" cy="303" r="7" fill="#64dfb2"/><circle cx="991" cy="303" r="7" fill="#64dfb2"/><circle cx="1015" cy="303" r="7" fill="#64dfb2"/><text x="1040" y="309" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><text x="50" y="413" font-size="24" font-weight="700" fill="#eef5ff">macOS</text><rect x="270" y="363" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="297" cy="403" r="7" fill="#70b7ff"/><circle cx="321" cy="403" r="7" fill="#70b7ff"/><circle cx="345" cy="403" r="7" fill="#70b7ff"/><text x="370" y="409" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><rect x="605" y="363" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="632" cy="403" r="7" fill="#bfadff"/><circle cx="656" cy="403" r="7" fill="#bfadff"/><circle cx="680" cy="403" r="7" fill="#bfadff"/><text x="705" y="409" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><rect x="940" y="363" width="305" height="80" rx="18" fill="#142139" stroke="#304663" stroke-width="2"/><circle cx="967" cy="403" r="7" fill="#64dfb2"/><circle cx="991" cy="403" r="7" fill="#64dfb2"/><circle cx="1015" cy="403" r="7" fill="#64dfb2"/><text x="1040" y="409" font-size="18" font-weight="400" fill="#eef5ff">3 pinned versions</text><circle cx="1220" cy="379" r="7" fill="#ffce75"/><text x="40" y="490" font-size="28" font-weight="700" fill="#70b7ff">27 bundled targets</text><text x="343" y="490" font-size="28" font-weight="400" fill="#a8bdd8">+</text><text x="397" y="490" font-size="26" font-weight="700" fill="#bfadff">6 Chrome / Edge Stable</text><text x="757" y="490" font-size="28" font-weight="400" fill="#a8bdd8">+</text><text x="811" y="490" font-size="26" font-weight="700" fill="#64dfb2">2 Beta channels on Linux</text><rect x="40" y="520" width="1280" height="65" rx="18" fill="#142139" stroke="#ffce75" stroke-width="2"/><text x="64" y="560" font-size="23" font-weight="700" fill="#ffce75">35 total · 5 current-generation targets marked in amber form the PR / beta subset.</text><text x="40" y="622" font-size="19" font-weight="400" fill="#a8bdd8">WebKit is not native Safari. Playwright Firefox is patched. Browser channels record installed versions.</text></g></svg>
