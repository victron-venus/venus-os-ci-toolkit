<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">From reviewed source to a verified release</title>
  <desc id="desc">Five steps: public repository, release candidate, bounded fuzzing, evidence verification, stable release. Failures return to a new RC after repair.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="0" y="0" width="1200" height="500" rx="0" fill="#f8fafc" stroke="none" />
    <text x="40" y="55" font-size="29" fill="#10243a" font-weight="700" text-anchor="start">From reviewed source to a verified release</text>
    <text x="40" y="88" font-size="17" fill="#475569" font-weight="400" text-anchor="start">One release path, with an explicit repair loop. Ordinary deterministic CI remains separate.</text>
    <rect x="40" y="120" width="208" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="56" y="136" width="40" height="32" rx="9" fill="#e0f2fe" stroke="none" />
    <text x="76" y="159" font-size="18" fill="#0369a1" font-weight="700" text-anchor="middle">01</text>
    <text x="56" y="199" font-size="18" fill="#0369a1" font-weight="700" text-anchor="start">Public repository</text>
    <text x="56" y="232" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Visibility checked</text>
    <text x="56" y="258" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Reviewed, pinned setup</text>
    <path d="M251 207 H269" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="272" y="120" width="208" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="288" y="136" width="40" height="32" rx="9" fill="#ede9fe" stroke="none" />
    <text x="308" y="159" font-size="18" fill="#6d28d9" font-weight="700" text-anchor="middle">02</text>
    <text x="288" y="199" font-size="18" fill="#6d28d9" font-weight="700" text-anchor="start">Release candidate</text>
    <text x="288" y="232" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Default-branch RC</text>
    <text x="288" y="258" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Source + attempt frozen</text>
    <path d="M483 207 H501" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="504" y="120" width="208" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="520" y="136" width="40" height="32" rx="9" fill="#ccfbf1" stroke="none" />
    <text x="540" y="159" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">03</text>
    <text x="520" y="199" font-size="18" fill="#0f766e" font-weight="700" text-anchor="start">Bounded fuzzing</text>
    <text x="520" y="232" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Replay seeds, then mutate</text>
    <text x="520" y="258" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Real production targets</text>
    <path d="M715 207 H733" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="736" y="120" width="208" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="752" y="136" width="40" height="32" rx="9" fill="#e0f2fe" stroke="none" />
    <text x="772" y="159" font-size="18" fill="#0369a1" font-weight="700" text-anchor="middle">04</text>
    <text x="752" y="199" font-size="18" fill="#0369a1" font-weight="700" text-anchor="start">Verify evidence</text>
    <text x="752" y="232" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Reports + file hashes</text>
    <text x="752" y="258" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Package acceptance</text>
    <path d="M947 207 H965" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="968" y="120" width="208" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="984" y="136" width="40" height="32" rx="9" fill="#ccfbf1" stroke="none" />
    <text x="1004" y="159" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">05</text>
    <text x="984" y="199" font-size="18" fill="#0f766e" font-weight="700" text-anchor="start">Stable release</text>
    <text x="984" y="232" font-size="14" fill="#475569" font-weight="400" text-anchor="start">All required gates pass</text>
    <text x="984" y="258" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Policy-aware promotion</text>
    <path d="M 852 305 V 350 H 388 V 305" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)" />
    <text x="620" y="380" font-size="19" fill="#b45309" font-weight="600" text-anchor="middle">Failure → reproduce → fix → regression test → new RC</text>
    <rect x="40" y="407" width="1120" height="65" rx="16" fill="#e2e8f0" stroke="none" />
    <text x="60" y="435" font-size="16" fill="#10243a" font-weight="600" text-anchor="start">No timed fuzz campaign on private repositories, PRs, pushes, beta, nightly or stable promotion.</text>
    <text x="60" y="460" font-size="15" fill="#475569" font-weight="400" text-anchor="start">A passing RC still needs every package, platform and release-policy check required by its project.</text>
  </g>
</svg>
