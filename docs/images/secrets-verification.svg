    <text x="54" y="531" class="label">Terraform mock tests</text>
    <rect x="355" y="502" width="216" height="42" rx="8" fill="#c15d76"/>
    <text x="587" y="531" class="count">18</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="355" y="587">0</text>
    <text x="475" y="587">10</text>
    <text x="595" y="587">20</text>
    <text x="715" y="587">30</text>
