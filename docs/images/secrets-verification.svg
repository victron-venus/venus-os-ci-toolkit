<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Local verification results, 2026-10-16</title>
  <desc id="desc">A horizontal bar chart of locally executed, passing checks: 56 CLI, SDK and installer checks (46 CLI contract checks, 3 offline checks with the actual OCI SDK and 7 installer boundary checks); 10 private materialization tests; 3 real age recovery tests; and 6 Terraform static checks, totaling 75 Python checks. Separately, 18 Terraform mock tests passed. Bar lengths represent test counts, not coverage percentages. These are local test counts. Synthetic cloud experiments are reported separately. Hosted CI remains pending.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182a40; }
    .title { font-size: 30px; font-weight: 750; }
    .subtitle { font-size: 18px; fill: #465a72; }
    .label { font-size: 19px; font-weight: 550; }
    .count { font-size: 21px; font-weight: 750; }
    .tick { font-size: 15px; fill: #52647a; }
    .note { font-size: 19px; font-weight: 650; }
    .small { font-size: 16px; fill: #465a72; }
  </style>
  <rect width="1200" height="740" rx="24" fill="#f8fafc"/>
  <text x="40" y="58" class="title">Local verification, by test group</text>
  <text x="40" y="94" class="subtitle">2026-10-16 · Locally executed checks · All five groups passed</text>
  <rect x="32" y="139" width="1136" height="485" rx="20" fill="#ffffff" stroke="#dce4ee" stroke-width="1.5"/>
  <g stroke="#e3e9f1" stroke-width="1">
    <path d="M 355 172 V 563"/>
    <path d="M 475 172 V 563"/>
    <path d="M 595 172 V 563"/>
    <path d="M 715 172 V 563"/>
    <path d="M 835 172 V 563"/>
    <path d="M 955 172 V 563"/>
    <path d="M 1075 172 V 563"/>
  </g>
  <g>
    <text x="54" y="215" class="label">CLI / SDK / installer</text>
    <text x="54" y="241" class="small">46 CLI · 3 offline SDK · 7 installer</text>
    <rect x="355" y="190" width="672" height="42" rx="8" fill="#477bc4"/>
