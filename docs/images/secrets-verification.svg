<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Local verification results, 2026-10-16</title>
  <desc id="desc">A horizontal bar chart of locally executed, passing checks: 59 CLI, SDK and installer checks (49 CLI contract checks, 3 offline checks with the actual OCI SDK and 7 installer boundary checks); 10 private materialization tests; 3 real age recovery tests; and 8 Terraform contract checks (6 static and 2 real Terraform parser tests), totaling 80 Python checks. Separately, 18 Terraform mock tests passed. Bar lengths represent test counts, not coverage percentages. These are local test counts. Baseline local counts shown. Merged baseline hosted CI passed; follow-up checks are recorded separately.</desc>
