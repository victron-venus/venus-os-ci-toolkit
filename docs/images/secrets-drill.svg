<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">A safe local rehearsal for secret recovery</title>
  <desc id="description">The offline synthetic drill creates two encrypted catalog generations and fresh operator, recovery and wrong keys. It removes only its disposable operator key and recovers with the second key. It verifies exact recovered content and private immutable output. Wrong keys, modified ciphertext, rollback against the retained latest generation, wrong digests and conflicting output must be refused. Temporary files are removed before a sanitized success report. This does not test off-device backup, account recovery, production consumers or secure erasure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52647a"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182a40; }
    .title { font-size: 31px; font-weight: 750; }
    .lead { font-size: 19px; fill: #465a72; }
    .heading { font-size: 22px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; }
    .label { font-size: 15px; font-weight: 750; letter-spacing: 1px; }
    .white { fill: #fff; }
  </style>
  <rect width="1200" height="840" rx="24" fill="#f7f9fc"/>
  <text x="40" y="58" class="title">Rehearse the failure. Keep real secrets out.</text>
  <text x="40" y="94" class="lead">One local drill · Fresh disposable keys · Synthetic generations · No cloud access</text>
  <rect x="40" y="140" width="350" height="258" rx="18" fill="#eaf2ff" stroke="#5a87c6" stroke-width="1.5"/>
  <rect x="40" y="140" width="350" height="45" rx="18" fill="#315f9f"/>
  <text x="62" y="169" class="label white">1 / PREPARE</text>
  <text x="62" y="223" class="heading">Create a private rehearsal</text>
  <text x="62" y="260" class="body">Two catalog generations</text>
  <text x="62" y="290" class="body">Operator + recovery recipients</text>
  <text x="62" y="320" class="body">A separate wrong key</text>
  <text x="62" y="368" class="small">No supplied catalog or user key</text>
  <path d="M 396 268 H 417" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="425" y="140" width="350" height="258" rx="18" fill="#fff3d9" stroke="#bc8b29" stroke-width="1.5"/>
  <rect x="425" y="140" width="350" height="45" rx="18" fill="#805b15"/>
  <text x="447" y="169" class="label white">2 / LOSE AND RECOVER</text>
  <text x="447" y="223" class="heading">Use the recovery identity</text>
  <text x="447" y="260" class="body">Remove the test operator key</text>
  <text x="447" y="290" class="body">Decrypt both generations</text>
  <text x="447" y="320" class="body">Compare exact expected bytes</text>
  <text x="447" y="368" class="small">Only drill-created files are removed</text>
  <path d="M 781 268 H 802" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="810" y="140" width="350" height="258" rx="18" fill="#e6f6ee" stroke="#3b9470" stroke-width="1.5"/>
  <rect x="810" y="140" width="350" height="45" rx="18" fill="#236e51"/>
  <text x="832" y="169" class="label white">3 / MATERIALIZE</text>
  <text x="832" y="223" class="heading">Verify the recovered input</text>
  <text x="832" y="260" class="body">Check an independent digest</text>
  <text x="832" y="290" class="body">Write a private file once</text>
  <text x="832" y="320" class="body">Repeat identical bytes safely</text>
  <text x="832" y="368" class="small">Conflicting output is never replaced</text>
  <rect x="40" y="432" width="1120" height="156" rx="18" fill="#f2edfb" stroke="#9b7aba" stroke-width="1.5"/>
  <text x="62" y="471" class="heading">Expected refusals are part of success</text>
  <text x="62" y="507" class="body">Wrong key · Changed ciphertext · Rollback · Wrong digest · Conflicting file</text>
  <text x="62" y="548" class="small">Rollback is checked against retained generation 2. Encryption alone cannot detect replay of an old valid catalog.</text>
  <rect x="40" y="620" width="550" height="172" rx="18" fill="#203a59"/>
  <text x="62" y="661" class="heading white">Clean up, then report</text>
  <text x="62" y="698" class="body white">Verify removal of temporary files.</text>
  <text x="62" y="728" class="body white">Return fixed check names and status only.</text>
  <text x="62" y="766" class="small white">A failure or interruption is not a successful drill.</text>
  <rect x="610" y="620" width="550" height="172" rx="18" fill="#fff" stroke="#ccd7e4" stroke-width="1.5"/>
  <text x="632" y="661" class="heading">This does not establish</text>
  <text x="632" y="698" class="body">Off-device retrieval or key custody</text>
  <text x="632" y="728" class="body">Cloud / account / consumer recovery</text>
  <text x="632" y="766" class="small">File removal is not a secure-erasure guarantee.</text>
</svg>
