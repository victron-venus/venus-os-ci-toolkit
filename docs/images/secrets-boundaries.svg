<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Secret control-plane trust boundaries</title><desc id="desc">Four labelled boundaries separate public code, the private operator, runtime destinations and independent recovery. The operator uses public tooling, publishes selected values to runtime destinations and copies ciphertext to recovery storage. Runtime consumers do not receive the catalog decryption key or bootstrap administration. One rotation authority owns each entry; automatic federation and consumer rollout are outside this implementation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15263c}.title{font-size:30px;font-weight:750}.subtitle{font-size:17px;fill:#475569}.heading{font-size:21px;font-weight:700}.label{font-size:15px;font-weight:700;letter-spacing:1px}.body{font-size:17px}.small{font-size:15px;fill:#475569}.number{font-size:19px;font-weight:800;fill:white}</style>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="40" y="53" class="title">Four boundaries. Four different responsibilities.</text><text x="40" y="88" class="subtitle">Least privilege follows the consumer. Recovery does not depend on a surviving cloud account.</text><rect x="40" y="142" width="530" height="226" rx="18" fill="#eaf2ff" stroke="#92b6ee" stroke-width="2" stroke-dasharray="7 6"/><text x="64" y="181" class="label">1  PUBLIC TOOLING</text><text x="64" y="231" class="body">Code, schemas, guides and synthetic fixtures</text><text x="64" y="269" class="body">No credentials, real target IDs or private history</text><text x="64" y="307" class="body">Untrusted PRs never receive the decryption key</text><rect x="630" y="142" width="530" height="226" rx="18" fill="#f3edff" stroke="#b89ade" stroke-width="2" stroke-dasharray="7 6"/><text x="654" y="181" class="label">2  PRIVATE OPERATOR</text><text x="654" y="231" class="body">Encrypted catalog + reviewed target bindings</text><text x="654" y="269" class="body">Decryption key and publishing session</text><text x="654" y="307" class="body">Plaintext briefly exists in trusted process memory</text><rect x="40" y="418" width="530" height="226" rx="18" fill="#e5f6f2" stroke="#7fc3b3" stroke-width="2" stroke-dasharray="7 6"/><text x="64" y="457" class="label">3  RUNTIME DESTINATIONS</text><text x="64" y="507" class="body">OCI and HCP receive only selected values</text><text x="64" y="545" class="body">Consumers use narrowly scoped access</text><text x="64" y="583" class="body">No catalog key and no bootstrap administration</text><rect x="630" y="418" width="530" height="226" rx="18" fill="#fff5db" stroke="#dbb45b" stroke-width="2" stroke-dasharray="7 6"/><text x="654" y="457" class="label">4  INDEPENDENT RECOVERY</text><text x="654" y="507" class="body">Versioned ciphertext + protected state / assets</text><text x="654" y="545" class="body">Separate key custody and account recovery</text><text x="654" y="583" class="body">Offline / offsite copy, periodically restored</text><path d="M 572 255 L 625 255" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="592" y="225" class="small">use</text><path d="M 756 370 L 756 412" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M 630 351 L 599 351 L 599 450 L 574 450" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="697" class="subtitle">Operational rule: one rotation authority per entry; no automatic cloud-to-catalog merge.</text><text x="40" y="729" class="small">Workload identity federation and automatic consumer rollout require separate implementation and review.</text>
</svg>