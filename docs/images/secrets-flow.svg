<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Normal secret control-plane flow</title><desc id="desc">Public code enters a private operator environment. A whole-file age-encrypted JSON catalog is decrypted, validated and reviewed there. Selected values are published separately through the OCI API, HCP write-only Terraform inputs and existing GitHub Actions secret destinations. Only encrypted backups go to an independent offline or offsite recovery copy; the recovery key is held separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15263c}.title{font-size:30px;font-weight:750}.subtitle{font-size:17px;fill:#475569}.heading{font-size:21px;font-weight:700}.label{font-size:15px;font-weight:700;letter-spacing:1px}.body{font-size:17px}.small{font-size:15px;fill:#475569}.number{font-size:19px;font-weight:800;fill:white}</style>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="40" y="53" class="title">One encrypted catalog. Explicit destinations.</text><text x="40" y="88" class="subtitle">Public tooling stays separate from private values, target bindings and recovery material.</text><rect x="40" y="136" width="252" height="330" rx="18" fill="#eaf2ff" stroke="#92b6ee" stroke-width="2"/><text x="62" y="172" class="label">PUBLIC SOURCE</text><text x="62" y="221" class="heading">Reviewed tooling</text><text x="62" y="261" class="body">CLI and schemas</text><text x="62" y="286" class="body">Terraform modules</text><text x="62" y="311" class="body">Synthetic examples</text><text x="62" y="422" class="small">No operator payloads</text><rect x="326" y="136" width="474" height="330" rx="18" fill="#f3edff" stroke="#b89ade" stroke-width="2" stroke-dasharray="7 6"/><text x="348" y="172" class="label">PRIVATE OPERATOR ENVIRONMENT</text><rect x="350" y="193" width="426" height="96" rx="18" fill="#ffffff" stroke="#c9b6e8" stroke-width="2"/><text x="372" y="226" class="heading">age-encrypted JSON catalog</text><text x="372" y="255" class="body">Values + full catalog metadata</text><path d="M 563 289 L 563 329" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="335" width="426" height="102" rx="18" fill="#ffffff" stroke="#c9b6e8" stroke-width="2"/><text x="372" y="368" class="heading">Decrypt → validate → review</text><text x="372" y="404" class="body">Explicit publication; plaintext in memory</text><path d="M 292 382 L 347 382" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="846" y="136" width="314" height="330" rx="18" fill="#e5f6f2" stroke="#7fc3b3" stroke-width="2"/><text x="868" y="172" class="label">SELECTED DESTINATIONS</text><rect x="868" y="193" width="268" height="72" rx="14" fill="#ffffff" stroke="#98d0c2" stroke-width="2"/><text x="888" y="223" class="heading">OCI Secrets</text><text x="888" y="248" class="small">Direct API publication</text><rect x="868" y="280" width="268" height="72" rx="14" fill="#ffffff" stroke="#98d0c2" stroke-width="2"/><text x="888" y="310" class="heading">HCP variables</text><text x="888" y="335" class="small">Write-only Terraform input</text><rect x="868" y="367" width="268" height="72" rx="14" fill="#ffffff" stroke="#98d0c2" stroke-width="2"/><text x="888" y="397" class="heading">GitHub Actions</text><text x="888" y="422" class="small">Existing explicit secret scopes</text><path d="M 777 385 L 823 385 L 823 229 L 865 229 M 823 316 L 865 316 M 823 385 L 823 403 L 865 403" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 562 466 L 562 525" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="583" y="503" class="small">Encrypted copies only</text><rect x="326" y="534" width="834" height="136" rx="18" fill="#fff5db" stroke="#dbb45b" stroke-width="2"/><text x="350" y="570" class="label">INDEPENDENT RECOVERY</text><text x="350" y="607" class="heading">Versioned encrypted backup + private asset archives</text><text x="350" y="641" class="body">Offline / offsite copy. Recovery identity held separately from the payloads.</text><text x="40" y="711" class="subtitle">Review each destination. Separate updates are not one atomic transaction.</text>
</svg>