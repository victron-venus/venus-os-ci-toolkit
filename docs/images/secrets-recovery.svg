<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Six steps for independent recovery</title><desc id="desc">Steps one to three run left to right across the top: choose a trusted catalog generation, restore in isolation using a separately held key, recover account access. Steps four to six run right to left across the bottom: rebuild or import surviving infrastructure, rebind new identifiers and republish valid values, then verify consumers before cutover. A synthetic local drill is distinct from a live recovery test.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15263c}.title{font-size:30px;font-weight:750}.subtitle{font-size:17px;fill:#475569}.heading{font-size:21px;font-weight:700}.label{font-size:15px;font-weight:700;letter-spacing:1px}.body{font-size:17px}.small{font-size:15px;fill:#475569}.number{font-size:19px;font-weight:800;fill:white}</style>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="40" y="53" class="title">Restore the capability, not just the vault.</text><text x="40" y="88" class="subtitle">An independent encrypted backup and a separately recoverable key start the recovery path.</text><rect x="40" y="145" width="340" height="202" rx="18" fill="#fff5db" stroke="#dbb45b" stroke-width="2"/><circle cx="71" cy="179" r="17" fill="#334155"/><text x="65" y="186" class="number">1</text><text x="62" y="229" class="heading">Choose a trusted generation</text><text x="62" y="266" class="body">Compare backup inventory</text><text x="62" y="292" class="body">and publication records.</text><text x="62" y="318" class="body">Preserve partial-write evidence.</text><rect x="430" y="145" width="340" height="202" rx="18" fill="#f3edff" stroke="#b89ade" stroke-width="2"/><circle cx="461" cy="179" r="17" fill="#334155"/><text x="455" y="186" class="number">2</text><text x="452" y="229" class="heading">Restore in isolation</text><text x="452" y="266" class="body">Recover the separate age key.</text><text x="452" y="292" class="body">Validate the encrypted catalog.</text><text x="452" y="318" class="body">Check private asset manifests.</text><rect x="820" y="145" width="340" height="202" rx="18" fill="#eaf2ff" stroke="#92b6ee" stroke-width="2"/><circle cx="851" cy="179" r="17" fill="#334155"/><text x="845" y="186" class="number">3</text><text x="842" y="229" class="heading">Recover account access</text><text x="842" y="266" class="body">Use independent OCI / HCP</text><text x="842" y="292" class="body">account and MFA recovery.</text><text x="842" y="318" class="body">Limit temporary permissions.</text><rect x="820" y="430" width="340" height="202" rx="18" fill="#eaf2ff" stroke="#92b6ee" stroke-width="2"/><circle cx="851" cy="464" r="17" fill="#334155"/><text x="845" y="471" class="number">4</text><text x="842" y="514" class="heading">Rebuild or import</text><text x="842" y="551" class="body">Inspect surviving resources.</text><text x="842" y="577" class="body">Restore separate state files.</text><text x="842" y="603" class="body">Review plans before applying.</text><rect x="430" y="430" width="340" height="202" rx="18" fill="#e5f6f2" stroke="#7fc3b3" stroke-width="2"/><circle cx="461" cy="464" r="17" fill="#334155"/><text x="455" y="471" class="number">5</text><text x="452" y="514" class="heading">Rebind and republish</text><text x="452" y="551" class="body">Record new resource IDs.</text><text x="452" y="577" class="body">Reissue invalid credentials.</text><text x="452" y="603" class="body">Publish the intended revision.</text><rect x="40" y="430" width="340" height="202" rx="18" fill="#e5f6f2" stroke="#7fc3b3" stroke-width="2"/><circle cx="71" cy="464" r="17" fill="#334155"/><text x="65" y="471" class="number">6</text><text x="62" y="514" class="heading">Verify, then cut over</text><text x="62" y="551" class="body">Test the intended consumers.</text><text x="62" y="577" class="body">Revoke temporary access.</text><text x="62" y="603" class="body">Back up the new generation.</text><path d="M 382 246 L 424 246" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 772 246 L 814 246" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 990 348 L 990 421" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="760" y="389" class="small">Review before changes</text><path d="M 815 531 L 777 531" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 425 531 L 387 531" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="690" class="subtitle">Practice first with synthetic values. A local drill does not prove live cloud recovery.</text><text x="40" y="724" class="small">New OCI IDs may be required. Lost nonexportable keys and expired tokens cannot simply be replayed.</text>
</svg>