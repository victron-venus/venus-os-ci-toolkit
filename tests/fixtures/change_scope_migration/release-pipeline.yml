# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release pipeline
run-name: "Release ${{ inputs.channel || github.event_name }} · ${{ github.sha }}"
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 37 2 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Release channel
        options:
          - nightly
          - beta
          - rc
          - stable
        default: rc
        required: true
      version:
        type: string
        description: Base X.Y.Z (defaults to committed project version)
        required: false
      rc_tag:
        type: string
        description: 'For stable only: checked vX.Y.Z-rc.N'
        required: false
      expected_sha:
        type: string
        description: Optional exact default-branch SHA; the local CLI fills this to detect ref movement
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  scope:
    name: Change scope
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '[]'
          REQUIRED_PATHS: '[]'
          FORCE_FULL: 'true'
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
  prepare:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      status: ${{ steps.metadata.outputs.status }}
      plan_artifact: ${{ steps.metadata.outputs.plan_artifact }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: metadata
        run: python3 scripts/release_versioned.py prepare --repo "$GITHUB_REPOSITORY"
        env:
          PUBLICATION_ENABLED: ${{ vars.RELEASE_CHANNELS_ENABLED }}
          GH_TOKEN: ${{ github.token }}
      - name: Store exact version plan before building
        if: ${{ steps.metadata.outputs.build == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.plan_artifact }}
          path: .release-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    permissions:
      contents: write
      actions: read
  checks:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' || needs.prepare.outputs.status == 'version-required' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      force-full: true
    permissions:
      contents: read
      actions: read
      security-events: write
  build:
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      release_plan_artifact: ${{ needs.prepare.outputs.plan_artifact }}
  gate:
    name: Release gate
    needs:
      - prepare
      - checks
      - build
      - sign
      - fuzz
    if: ${{ always() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.status == 'version-required') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - env:
          RESULTS: ${{ toJSON(needs) }}
          FUZZ_REQUIRED: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = dict.fromkeys(('prepare', 'checks', 'build', 'sign'), 'success')
          if results.get('prepare', {}).get('outputs', {}).get('status') == 'version-required':
              expected['build'] = 'skipped'
              expected['sign'] = 'skipped'
          expected['fuzz'] = 'success' if os.environ['FUZZ_REQUIRED'] == 'true' else 'skipped'
          if set(results) != set(expected):
              raise SystemExit('Release job inventory differs')
          failed = {name: results.get(name, {}).get('result') for name, result in expected.items() if results.get(name, {}).get('result') != result}
          if failed:
              raise SystemExit(f'Release blocked: {failed}')
          PY
  candidate:
    needs:
      - prepare
      - gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.prepare.outputs.build == 'true' && needs.prepare.outputs.channel != 'stable' && vars.RELEASE_CHANNELS_ENABLED == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - &id001
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the plan used by every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish checked candidate
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        if: ${{ steps.publication.outputs.status != 'superseded' && steps.publication.outputs.status != 'reused' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  stable:
    needs: prepare
    if: ${{ needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build == 'false' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - *id001
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Promote RC bytes after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: python3 scripts/release_control.py promote --repo "$GITHUB_REPOSITORY" --rc "$RC_TAG" --run-id "$GITHUB_RUN_ID"
  final:
    needs:
      - prepare
      - gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the plan used by every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish the separately validated final packages after approval
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        if: ${{ steps.publication.outputs.status != 'superseded' && steps.publication.outputs.status != 'reused' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    environment: release
  sign:
    name: Sign complete release inventory
    needs:
      - prepare
      - checks
      - build
      - fuzz
    if: ${{ !cancelled() && (needs.prepare.outputs.build == 'true' && github.repository == 'victron-venus/dbus-event-log' && github.ref == 'refs/heads/main') && needs.prepare.result == 'success' && needs.checks.result == 'success' && needs.build.result == 'success' && (needs.fuzz.result == 'success' || (needs.prepare.outputs.channel != 'rc' && needs.fuzz.result == 'skipped')) }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - name: Apply the reviewed frozen version plan
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .release-download
          merge-multiple: false
      - name: Collect original build assets
        run: |
          # A retried signing job must not ingest its own previous output.
          rm -rf ".release-download/release-assets-signature-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          python3 scripts/release.py collect .release-download .release-assets
      - name: Verify build receipts and inventory reviewed source
        run: python3 scripts/release_signing.py prepare .release-assets --source-sha "$GITHUB_SHA"
      - name: Sign the complete source and artifact inventory
        run: cosign sign-blob --yes --bundle .release-assets/release-signatures.sigstore.json .release-assets/release-signatures.json
      - name: Verify publisher identity and every payload
        run: python3 scripts/release_signing.py verify .release-assets --source-sha "$GITHUB_SHA"
      - name: Reject an incorrect source identity
        run: |
          if python3 scripts/release_signing.py verify .release-assets --source-sha 0000000000000000000000000000000000000000; then
            echo 'Signature accepted an incorrect source SHA' >&2
            exit 1
          fi
      - name: Bind the signature and source archive to the version plan
        run: python3 scripts/stage_release_assets.py --target signature --pattern .release-assets/release-signatures.json --pattern .release-assets/release-signatures.sigstore.json --pattern ".release-assets/source-$GITHUB_SHA.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-signature-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-assets/signature/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
  fuzz:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@2439b9eb60cdbcd02edf43b62c551a357be3accc # main
    with:
      toolkit-ref: 2439b9eb60cdbcd02edf43b62c551a357be3accc
      release-plan-artifact: ${{ needs.prepare.outputs.plan_artifact }}
    permissions:
      contents: read
